**3 scripts atualizados para usar Crawl4ai + yt-dlp + aria2:**

| Script | Funcao | Resultado |
|--------|--------|-----------|
| `agrupadordelistas.py` | Agrega 7 fontes M3U, testa canais em paralelo | 140 canais ativos em `lista1.M3U` |
| `ia2.py` | Processa URLs do `ia.txt` com yt-dlp | Gerou `lista30.M3U` com 1 item |
| `process_m3u.py` | Processa REALITY.m3u com validacao completa | Gerou `REALITY_CLEAN.m3U` com 5 canais |

**O que cada script faz agora:**
- **Download**: Crawl4ai -> Aria2 -> Requests (fallback automatico)
- **Teste de URLs**: Paralelo com `ThreadPoolExecutor` (30 workers), timeout de 4s
- **Limpeza**: Remove canais offline, EXTINF sem links, logos http->https
- **EPG**: Testa automaticamente e usa `https://epg.pw/xmltv/epg_lite.xml`
- **Dedup**: Remove canais duplicados por URL

**Para rodar no GitHub Actions**, o workflow que usa `ia2.py` agora funciona porque o yt-dlp esta instalado via pip no workflow.
