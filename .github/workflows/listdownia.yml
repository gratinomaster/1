name: TODOS PARA UM

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */8 * * *"

concurrency:
  group: newsworld-playlist
  cancel-in-progress: false

jobs:
  opencode:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> $GITHUB_PATH

      - name: Create prompt
        run: |
          cat << 'EOF' > prompt.txt
          pegue os canais que estão em
              "https://github.com/gmtv4/rastaf/contents",
              "https://github.com/gratinomaster/1/raw/refs/heads/main/lista2.M3U",
              "https://github.com/iptv-org/iptv/raw/6b77242580c3b34d34f984265bfed2937708fce0/streams/us_moveonjoy.m3u",
              "https://github.com/strikeinthehouse/1/raw/refs/heads/main/lista_1.M3U",
              "https://github.com/otoxp/wepg/raw/df55b2ba14f8ec85bd198f85bd3c8cf35d3fa482/list/lista-globos-mitv.m3u",
              "https://github.com/punkstarbr/STR-YT/raw/refs/heads/main/REALITY.m3u",
              "https://github.com/iprtl/m3u/raw/b8507db8229defeda88512eaaf66bfe0e385e81c/Freetv.m3u",
              "https://github.com/ipstreet312/freeiptv/raw/refs/heads/master/all.m3u",
              "https://github.com/punkrastafari/neta/raw/refs/heads/main/lista_final.m3u",
          ]
          B. Repositórios consultados pela API do GitHub
          GITHUB_API_SOURCES = [
              "https://api.github.com/repos/gmtv4/rastaf/contents",
              "https://api.github.com/repos/gratinomaster/JCTV/contents",
              "https://api.github.com/repos/strikeinthehouse/YT-OK/contents",
              "https://api.github.com/repos/punkstarbr/STR-YT/contents",
          ]
          Para essas fontes, consulte a API e identifique arquivos .m3u e .m3u8. Se a URL já apontar para um arquivo direto, baixe o arquivo em vez de tentar interpretá-lo como um diretório JSON.
          
          C. Fontes adicionais para atualização programada
          SCHEDULED_M3U_SOURCES = [
              "https://github.com/LITUATUI/M3UPT/raw/main/M3U/M3UPT.m3u",
              "https://github.com/strikeinthehouse/1/raw/main/lista2.M3U",
              "https://github.com/punkstarbr/STR-YT/raw/main/lista1.M3U",
              "https://github.com/strikeinthehouse/M3UPT/raw/main/M3U/M3UPT.m3u",
          ]
          Associe essas fontes aos intervalos de horário configurados pelo usuário, usando o fuso America/Sao_Paulo. Preserve os dados existentes quando uma fonte estiver indisponível ou fora do período de atualização.
          
          D. Fonte de vídeos VOD do Internet Archive
          VOD_SOURCES = [
              "https://archive.org/details/television?query=cbs&sort=date&tab=collection",
          ]
          Utilize essa página como ponto inicial para pesquisar itens de vídeo. Extraia títulos, miniaturas e URLs de reprodução somente quando estiverem disponíveis. Não presuma que todos os resultados da pesquisa sejam vídeos reproduzíveis.
          
          E. Fontes adicionais para coleta de playlists
          ADDITIONAL_M3U_SOURCES = [
              "https://github.com/punkstarbr/STR-YT/raw/refs/heads/main/REALITY.m3u",
              "https://github.com/iprtl/m3u/raw/b8507db8229defeda88512eaaf66bfe0e385e81c/Freetv.m3u",
              "https://github.com/ipstreet312/freeiptv/raw/refs/heads/master/all.m3u",
              "https://github.com/punkrastafari/neta/raw/refs/heads/main/lista_final.m3u",
          ]
          salve em lista1.m3u apagando os canais que estavam nesse arquivo antes de colocar os novos
          EOF

      - name: Run OpenCode
        run: |
          echo "Executando OpenCode..."
          opencode run "$(cat prompt.txt)"

      - name: Check generated files
        run: |
          echo "Arquivos no diretório:"
          ls -la

          if [ -f lista5.m3u ]; then
            echo "Playlist criada:"
            cat lista5.m3u
          else
            echo "lista5.m3u não foi criado"
          fi

      - name: Commit and Push safely
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add . || true
          git commit -m "Atualização automática da playlist" || echo "Nada para commit"

          # tenta sincronizar e enviar sem sobrescrever ninguém
          for i in {1..10}; do
            echo "Tentativa $i de push..."

            git fetch origin

            git rebase origin/$(git rev-parse --abbrev-ref HEAD) || {
              echo "Conflito no rebase, abortando e tentando novamente..."
              git rebase --abort
              sleep 5
              continue
            }

            git push origin HEAD && break

            echo "Push falhou, tentando novamente em 5s..."
            sleep 5
          done
