name: TODOS PARA UM

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-playlist-${{ github.ref }}
  cancel-in-progress: false

jobs:
  atualizar-playlist:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Instalar OpenCode
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Executar OpenCode
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.opencode/bin:$PATH"

          if [ ! -s prompt.txt ]; then
            echo "::error::O arquivo prompt.txt não existe ou está vazio."
            exit 1
          fi

          echo "Executando OpenCode..."
          opencode run "$(cat prompt.txt )"

      - name: Verificar arquivo gerado
        shell: bash
        run: |
          set -euo pipefail

          echo "Diretório atual:"
          pwd

          echo "Arquivos encontrados:"
          ls -lah

          if [ -f lista1.M3U ]; then
            FILE="lista1.M3U"
          elif [ -f lista5.m3u ]; then
            FILE="lista5.m3u"
            echo "Usando o arquivo alternativo lista5.m3u"
          else
            echo "::error::A playlist não foi criada."
            exit 1
          fi

          if [ ! -s "$FILE" ]; then
            echo "::error::A playlist está vazia."
            exit 1
          fi

          if ! grep -q '^#EXTM3U' "$FILE"; then
            echo "::error::Cabeçalho #EXTM3U ausente."
            exit 1
          fi

          echo "Playlist validada: $FILE"
          echo "Total de linhas: $(wc -l < "$FILE")"
          echo "Total de canais: $(grep -c '^#EXTINF:' "$FILE" || true)"

      - name: Commit e envio da playlist
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -f lista1.M3U ]; then
            FILE="lista1.M3U"
          elif [ -f lista5.m3u ]; then
            FILE="lista5.m3u"
          else
            echo "::error::Playlist não encontrada para commit."
            exit 1
          fi

          git add -- "$FILE"

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para enviar."
            exit 0
          fi

          git commit -m "Atualização automática da playlist"

          BRANCH="${GITHUB_REF_NAME}"

          for i in $(seq 1 10); do
            echo "Tentativa $i de push..."

            git fetch origin \
              "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"

            if ! git rebase "origin/${BRANCH}"; then
              echo "::error::Falha no rebase. Verifique os conflitos."
              git rebase --abort || true
              exit 1
            fi

            if git push origin "HEAD:refs/heads/${BRANCH}"; then
              echo "Playlist enviada com sucesso."
              exit 0
            fi

            echo "Push falhou. Nova tentativa em 5 segundos..."
            sleep 5
          done

          echo "::error::Todas as tentativas de push falharam."
          exit 1
