name: Baixando Lista

on:
  schedule:
    - cron: '*/50 * * * *'  # Executa a cada 50 minutos
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Permissões necessárias para o GitHub Action fazer push no repositório
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # Resolve o aviso de depreciação do Node.js

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 requests

      - name: Verificar e criar ia.txt (se não existir)
        id: check_ia_txt
        run: |
          if [ ! -f ia.txt ]; then
            echo "ia.txt não encontrado, criando arquivo padrão..."
            echo "https://archive.org/details/globo-e-record-novelas-e-variados-2005-2006-e-2010-fita-vhs" > ia.txt
            echo "https://archive.org/details/globo-tv-gazeta-sao-paulo-e-redetv-ano-2007-em-fita-vhs" >> ia.txt
            echo "ia_txt_created=true" >> $GITHUB_OUTPUT
          else
            echo "ia_txt_created=false" >> $GITHUB_OUTPUT
          fi

      - name: Rodar script ia2.py
        run: python3 ia2.py

      - name: Verificar arquivos gerados
        id: check_generated_files
        run: |
          if [ -f lista30.M3U ]; then
            echo "✓ lista30.M3U gerada com sucesso ($(wc -l < lista30.M3U  ) linhas)"
            echo "m3u_generated=true" >> $GITHUB_OUTPUT
          else
            echo "::error::Arquivo lista30.M3U não foi criado!"
            echo "m3u_generated=false" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Commit e Push
        if: steps.check_generated_files.outputs.m3u_generated == 'true'
        run: |
          git add lista30.M3U
          # Adiciona ia.txt apenas se ele foi criado neste run
          if [ "${{ steps.check_ia_txt.outputs.ia_txt_created }}" == "true" ]; then
            git add ia.txt
          fi
          
          # Verifica se existem mudanças antes de commitar
          # Usamos 'git status --porcelain' para verificar se há alguma alteração (staged ou unstaged)
          if git status --porcelain | grep -q .; then
            git commit -m "🤖 Atualização automática da playlist - $(date '+%Y-%m-%d %H:%M')"
            
            # Antes de fazer o pull --rebase, garante que não há alterações não rastreadas que possam causar conflito
            # Isso é crucial para evitar o erro 'You have unstaged changes'
            git reset --hard HEAD
            
            # Tenta fazer o push com rebase para evitar conflitos de concorrência
            git pull --rebase origin main
            git push origin main
          else
            echo "Nenhuma mudança detectada na lista ou em ia.txt. Nada para commitar."
          fi
