name: Baixando Lista

on:
  schedule:
    - cron: '*/50 * * * *'  # Executa a cada 50 minutos
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Permissões necessárias para o GitHub Action fazer push no repositório
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # Resolve o aviso de depreciação do Node.js

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          # Adicionei lxml e requests que são comuns para scraping
          python -m pip install yt-dlp beautifulsoup4 lxml requests

      - name: Verificar arquivo ia.txt
        run: |
          if [ ! -f ia.txt ]; then
            echo "ia.txt não encontrado, criando arquivo padrão..."
            cat > ia.txt << 'EOF'
https://archive.org/details/globo-e-record-novelas-e-variados-2005-2006-e-2010-fita-vhs
https://archive.org/details/globo-tv-gazeta-sao-paulo-e-redetv-ano-2007-em-fita-vhs
EOF
          fi

      - name: Rodar script ia2.py
        run: python3 ia2.py

      - name: Verificar arquivos gerados
        run: |
          if [ -f lista30.M3U ]; then
            echo "✓ lista30.M3U gerada com sucesso ($(wc -l < lista30.M3U ) linhas)"
          else
            echo "::error::Arquivo lista30.M3U não foi criado!"
            exit 1
          fi

      - name: Commit e Push
        run: |
          # Adiciona apenas os arquivos necessários
          git add lista30.M3U ia.txt
          
          # Verifica se existem mudanças antes de commitar
          if git diff --cached --quiet; then
            echo "Nenhuma mudança detectada na lista."
          else
            git commit -m "🤖 Atualização automática da playlist - $(date '+%Y-%m-%d %H:%M')"
            
            # Tenta fazer o push com rebase para evitar conflitos de concorrência
            git pull --rebase origin main
            git push origin main
          fi
