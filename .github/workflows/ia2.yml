name: Baixando Lista

on:
  schedule:
    - cron: '*/50 * * * *'  # Executa a cada 50 minutos
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Git
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      - name: Deletar Log Antigo
        run: |
          rm -rf log.txt || echo "Log não existe, continuando..."

      - name: Instalar dependências
        run: |
          echo "Instalando dependências Python..."
          python3 -m pip install --upgrade pip
          python3 -m pip install yt-dlp beautifulsoup4

      - name: Verificar versão do Python e yt-dlp
        run: |
          python3 --version
          yt-dlp --version || echo "yt-dlp não instalado corretamente"

      - name: Verificar arquivo ia.txt
        run: |
          if [ -f ia.txt ]; then
            echo "✓ ia.txt encontrado"
            cat ia.txt
          else
            echo "ia.txt não encontrado, criando..."
            cat > ia.txt << 'EOF'
https://archive.org/details/globo-e-record-novelas-e-variados-2005-2006-e-2010-fita-vhs
https://archive.org/details/globo-tv-gazeta-sao-paulo-e-redetv-ano-2007-em-fita-vhs
EOF
          fi

      - name: Rodar script ia2.py
        run: python3 ia2.py

      - name: Verificar lista30.M3U
        run: |
          if [ -f lista30.M3U ]; then
            echo "✓ arquivo criado"
            wc -l lista30.M3U
          else
            echo "ERRO: lista30.M3U não foi criado"
            exit 1
          fi

      - name: Commit e Push
        run: |
          git add lista30.M3U log.txt ia.txt

          git diff --cached --quiet && echo "Sem mudanças" || (
            git commit -m "🤖 Atualização automática da playlist - $(date '+%Y-%m-%d %H:%M:%S')"
            git pull origin main --rebase
            git push origin main
          )
