name: Baixando Lista

on:
  schedule:
    - cron: '*/30 * * * *'  # Executa a cada 30 minutos
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Configurar Git
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action"

      - name: Deletar Log
        run: |
          rm -rf log.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install streamlink selenium requests beautifulsoup4 lxml python-dateutil yt-dlp pytz gdown playwright

      - name: Verificar versão do Python
        run: python --version

      - name: Rodar script agrupadordelistas.py
        run: python agrupadordelistas.py

      - name: Adicionar mudanças
        run: |
          git add -A
          git status

      - name: Commit e Push
        run: |
          git pull origin main --rebase || echo "Sem conflitos"
          git commit -m "Atualizar lista baixada" || echo "Nenhuma mudança"
          git push origin main || echo "Push ignorado"
