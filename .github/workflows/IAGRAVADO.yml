name: IA GRAVADO

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */8 * * *"

concurrency:
  group: newsworld-playlist
  cancel-in-progress: false

jobs:
  opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:

      # ========================================
      # CHECKOUT
      # ========================================
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Histórico completo evita limitações ao fazer rebase antes do push.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}


      # ========================================
      # INSTALL FFMPEG + YT-DLP
      # ========================================
      - name: Install FFmpeg and yt-dlp
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Instalando FFmpeg"
          echo "========================================"

          sudo apt-get update
          sudo apt-get install -y ffmpeg

          echo ""
          echo "========================================"
          echo "Instalando yt-dlp"
          echo "========================================"

          python3 -m pip install --user -U yt-dlp

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          echo ""
          echo "========================================"
          echo "Verificando FFmpeg"
          echo "========================================"

          command -v ffmpeg
          ffmpeg -version | head -1

          echo ""
          echo "========================================"
          echo "Verificando yt-dlp"
          echo "========================================"

          command -v yt-dlp
          yt-dlp --version


      # ========================================
      # INSTALL OPENCODE
      # ========================================
      - name: Install OpenCode
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Instalando OpenCode"
          echo "========================================"

          curl -fsSL https://opencode.ai/install | bash

          echo ""
          echo "========================================"
          echo "Verificando instalação"
          echo "========================================"

          echo "HOME=$HOME"

          ls -la "$HOME/.opencode" || true
          ls -la "$HOME/.opencode/bin" || true

          echo ""
          echo "Procurando executável..."

          if [ -x "$HOME/.opencode/bin/opencode" ]; then
            OPENCODE_PATH="$HOME/.opencode/bin/opencode"
          elif [ -x "$HOME/.opencode/opencode" ]; then
            OPENCODE_PATH="$HOME/.opencode/opencode"
          else
            echo "ERRO: executável do OpenCode não encontrado."

            echo ""
            echo "Possíveis executáveis encontrados:"

            find "$HOME/.opencode" \
              -maxdepth 4 \
              -type f \
              -name "opencode" \
              -print 2>/dev/null || true

            exit 1
          fi

          echo ""
          echo "OpenCode encontrado:"
          echo "$OPENCODE_PATH"

          echo ""
          echo "Versão:"
          "$OPENCODE_PATH" --version

          echo ""
          echo "Adicionando PATH..."
          echo "$(dirname "$OPENCODE_PATH")" >> "$GITHUB_PATH"

          echo "$OPENCODE_PATH" > "$RUNNER_TEMP/opencode_path"


      # ========================================
      # VERIFY IA.TXT
      # ========================================
      - name: Verify ia.txt
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Verificando ia.txt"
          echo "========================================"

          if [ ! -f ia.txt ]; then
            echo "ERRO: ia.txt não existe."
            exit 1
          fi

          TOTAL=$(sed '/^[[:space:]]*$/d' ia.txt | wc -l)

          echo "Links não vazios encontrados: $TOTAL"

          if [ "$TOTAL" -lt 29 ]; then
            echo "ERRO: ia.txt possui menos de 29 links."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "Primeiros 29 links"
          echo "========================================"

          sed '/^[[:space:]]*$/d' ia.txt | sed -n '1,29p'

          echo ""
          echo "Verificação concluída."


      # ========================================
      # CREATE PROMPT
      # ========================================
      - name: Create prompt
        shell: bash
        run: |
          cat << 'EOF' > "$RUNNER_TEMP/opencode-prompt.txt"

          Trabalhe SOMENTE dentro do diretório atual do repositório.

          OBJETIVO:

          Ler ia.txt, processar os 29 primeiros links não vazios usando yt-dlp
          e gerar o arquivo lista30.M3U.

          ========================================
          REGRAS DE SEGURANÇA
          ========================================

          1. Não faça operações fora do diretório atual do repositório.

          2. NÃO execute:
             find /

          3. NÃO faça buscas recursivas no sistema inteiro.

          4. NÃO procure logs do ffmpeg no filesystem inteiro.

          5. NÃO apague arquivos do sistema.

          6. NÃO apague arquivos fora do repositório.

          7. Não altere arquivos desnecessários.

          ========================================
          IA.TXT
          ========================================

          8. Leia ia.txt.

          9. Ignore linhas vazias.

          10. Considere somente os 29 primeiros links não vazios.

          11. Não processe links além desses 29.

          ========================================
          INTERNET ARCHIVE
          ========================================

          12. Os links são principalmente do Internet Archive.

          13. Um link pode ser:

              - página de item;
              - página de busca;
              - página de usuário;
              - página de coleção;
              - página contendo mídia.

          14. NÃO presuma que todo link é diretamente um vídeo.

          ========================================
          YT-DLP
          ========================================

          15. Use yt-dlp para tentar processar cada um dos 29 links.

          16. Tente obter uma URL de mídia reproduzível.

          17. Não invente URLs.

          18. Não transforme uma página HTML em uma falsa URL de vídeo.

          19. Se o yt-dlp não conseguir processar um link, registre a falha
              no resumo final e continue com o próximo. NÃO crie err.txt.

          20. NÃO crie err.txt nem outros arquivos auxiliares no diretório
              do repositório.

          21. Um erro em um link NÃO deve interromper o processamento dos
              outros links.

          22. No final, informe:

              - total de links analisados;
              - quantidade processada com sucesso;
              - quantidade que falhou.

          ========================================
          FFMPEG
          ========================================

          23. O FFmpeg já foi instalado pelo workflow.

          24. Para verificar sua existência use somente:

              command -v ffmpeg

          25. Não procure arquivos de log do FFmpeg.

          ========================================
          PLAYLIST
          ========================================

          26. Gere:

              lista30.M3U

          27. O arquivo deve ser criado no diretório atual do repositório.

          28. A primeira linha deve ser:

              #EXTM3U

          29. Use entradas:

              #EXTINF

          30. Cada entrada deve conter:

              tvg-logo

              group-title="VOD"

          31. Não invente URLs.

          32. Não coloque URLs HTML como se fossem URLs de mídia.

          33. Use somente URLs obtidas de forma válida pelo processamento.

          34. Mantenha a correspondência entre os links de entrada e as
              entradas geradas.

          ========================================
          FINALIZAÇÃO
          ========================================

          35. Verifique se lista30.M3U existe.

          36. Verifique se lista30.M3U não está vazio.

          37. Verifique se contém #EXTM3U.

          38. Verifique se contém #EXTINF.

          39. Verifique se contém group-title="VOD".

          40. Mostre um resumo final.

          41. NÃO execute buscas demoradas no sistema de arquivos.

          42. NÃO use find /.

          43. Não execute comandos Git e não altere outros arquivos do
              repositório.

          EOF

          echo "========================================"
          echo "Prompt criado"
          echo "========================================"

          cat "$RUNNER_TEMP/opencode-prompt.txt"


      # ========================================
      # RUN OPENCODE
      # ========================================
      - name: Run OpenCode
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Preparando OpenCode"
          echo "========================================"

          export PATH="$HOME/.opencode/bin:$HOME/.opencode:$HOME/.local/bin:$PATH"

          if [ -f "$RUNNER_TEMP/opencode_path" ]; then
            OPENCODE_PATH="$(cat "$RUNNER_TEMP/opencode_path")"
          else
            OPENCODE_PATH="$HOME/.opencode/bin/opencode"
          fi

          echo "OpenCode:"
          echo "$OPENCODE_PATH"

          echo ""
          echo "========================================"
          echo "Verificando OpenCode"
          echo "========================================"

          if [ ! -x "$OPENCODE_PATH" ]; then
            echo "ERRO: OpenCode não é executável."
            echo "$OPENCODE_PATH"
            exit 1
          fi

          "$OPENCODE_PATH" --version

          echo ""
          echo "========================================"
          echo "Verificando yt-dlp"
          echo "========================================"

          command -v yt-dlp
          yt-dlp --version

          echo ""
          echo "========================================"
          echo "Verificando FFmpeg"
          echo "========================================"

          command -v ffmpeg
          ffmpeg -version | head -1

          echo ""
          echo "========================================"
          echo "Executando OpenCode"
          echo "========================================"

          PROMPT_FILE="$RUNNER_TEMP/opencode-prompt.txt"

          if [ ! -s "$PROMPT_FILE" ]; then
            echo "ERRO: arquivo de prompt não foi criado ou está vazio."
            exit 1
          fi

          timeout 15m \
            "$OPENCODE_PATH" \
            run "$(cat "$PROMPT_FILE")"


      # ========================================
      # VALIDATE PLAYLIST
      # ========================================
      - name: Validate generated playlist
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Arquivos no diretório"
          echo "========================================"

          ls -lah

          echo ""
          echo "========================================"
          echo "Verificando lista30.M3U"
          echo "========================================"

          if [ ! -f lista30.M3U ]; then
            echo "ERRO: lista30.M3U não foi criado."
            exit 1
          fi

          if [ ! -s lista30.M3U ]; then
            echo "ERRO: lista30.M3U está vazio."
            exit 1
          fi

          echo "lista30.M3U existe e não está vazio."

          echo ""
          echo "========================================"
          echo "Primeiras linhas da playlist"
          echo "========================================"

          sed -n '1,30p' lista30.M3U

          echo ""
          echo "========================================"
          echo "Validação M3U"
          echo "========================================"

          if ! grep -q '^#EXTM3U' lista30.M3U; then
            echo "ERRO: lista30.M3U não possui #EXTM3U."
            exit 1
          fi

          EXTINF_COUNT=$(grep -c '^#EXTINF:' lista30.M3U || true)

          echo "Quantidade de #EXTINF: $EXTINF_COUNT"

          if [ "$EXTINF_COUNT" -eq 0 ]; then
            echo "ERRO: nenhuma entrada #EXTINF encontrada."
            exit 1
          fi

          if ! grep -q 'group-title="VOD"' lista30.M3U; then
            echo "ERRO: group-title=\"VOD\" não encontrado."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "PLAYLIST VALIDADA COM SUCESSO"
          echo "========================================"


      # ========================================
      # GIT STATUS
      # ========================================
      - name: Show git changes
        shell: bash
        run: |
          echo "========================================"
          echo "Git status"
          echo "========================================"

          git status --short


      # ========================================
      # COMMIT + PUSH
      # ========================================
      - name: Commit and Push safely
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Configurando Git"
          echo "========================================"

          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          echo ""
          echo "Branch:"
          git branch --show-current

          echo ""
          echo "Remote:"
          git remote -v

          echo ""
          echo "========================================"
          echo "Limpando artefatos temporários"
          echo "========================================"

          # O OpenCode pode criar err.txt ao registrar falhas do yt-dlp.
          # Remove-o somente quando ele for um arquivo não rastreado.
          # Se err.txt fizer parte do repositório, não o apaga.
          if [ -f err.txt ] && ! git ls-files --error-unmatch -- err.txt >/dev/null 2>&1; then
            rm -f -- err.txt
          fi

          echo ""
          echo "========================================"
          echo "Adicionando somente lista30.M3U"
          echo "========================================"

          git add -- lista30.M3U

          if git diff --cached --quiet -- lista30.M3U; then
            echo "Nenhuma alteração na playlist."
            exit 0
          fi

          # O commit deve conter somente a playlist. Qualquer outro arquivo
          # inesperado faz o workflow falhar para evitar commit indevido.
          EXTRA_FILES=$(git status --porcelain=v1 \
            | sed -E 's/^.. //' \
            | grep -Fvx 'lista30.M3U' || true)

          if [ -n "$EXTRA_FILES" ]; then
            echo "ERRO: existem alterações adicionais além de lista30.M3U."
            printf '%s\n' "$EXTRA_FILES"
            git status --short
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "Criando commit somente da playlist"
          echo "========================================"

          git commit --only lista30.M3U -m "Atualização automática da playlist"

          BRANCH=$(git rev-parse --abbrev-ref HEAD)

          echo "Branch: $BRANCH"

          echo ""
          echo "========================================"
          echo "Iniciando push"
          echo "========================================"

          for i in {1..10}; do

            echo ""
            echo "========================================"
            echo "Tentativa $i de 10"
            echo "========================================"

            echo "Fetch..."

            if timeout 60s git fetch origin "$BRANCH"; then
              echo "Fetch OK."
            else
              echo "Fetch falhou ou expirou."
              sleep 5
              continue
            fi

            echo ""
            echo "Rebase..."

            if timeout 60s git rebase "origin/$BRANCH"; then
              echo "Rebase OK."
            else
              echo "Rebase falhou."

              # Só tenta abortar quando um rebase realmente foi iniciado.
              if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
                git rebase --abort || true
              fi

              sleep 5
              continue
            fi

            echo ""
            echo "Push..."

            if timeout 60s git push origin "HEAD:$BRANCH"; then

              echo ""
              echo "========================================"
              echo "PUSH CONCLUÍDO COM SUCESSO!"
              echo "========================================"

              exit 0

            else

              echo "Push falhou ou expirou."
              sleep 5

            fi

          done

          echo ""
          echo "========================================"
          echo "ERRO"
          echo "========================================"

          echo "Todas as 10 tentativas de push falharam."

          exit 1
