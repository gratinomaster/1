name: ya

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "O que você quer gerar"
        required: true
        type: string

      filename:
        description: "Nome do arquivo de saída, por exemplo: lista.m3u"
        required: true
        type: string

concurrency:
  group: opencode-generated-file
  cancel-in-progress: false

jobs:
  opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write

    steps:
      # ========================================
      # CHECKOUT
      # ========================================
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: false
          show-progress: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # ========================================
      # SETUP PYTHON
      # ========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ========================================
      # VALIDATE INPUT FILENAME
      # ========================================
      - name: Validate output filename
        env:
          OUTPUT: ${{ inputs.filename }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Arquivo solicitado: ${OUTPUT}"

          if [ -z "${OUTPUT}" ]; then
            echo "ERRO: o nome do arquivo está vazio."
            exit 1
          fi

          if [[ "${OUTPUT}" == */* ]]; then
            echo "ERRO: informe somente o nome do arquivo, sem diretórios."
            exit 1
          fi

          if [[ ! "${OUTPUT}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "ERRO: nome de arquivo inválido."
            echo "Use somente letras, números, ponto, hífen e sublinhado."
            exit 1
          fi

          if [ "${OUTPUT}" = "." ] || [ "${OUTPUT}" = ".." ]; then
            echo "ERRO: nome de arquivo inválido."
            exit 1
          fi

          echo "Nome de arquivo válido."

      # ========================================
      # INSTALL SYSTEM TOOLS
      # ========================================
      - name: Install system tools
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "INSTALANDO FERRAMENTAS DO SISTEMA"
          echo "========================================"

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            aria2 \
            curl \
            wget \
            git \
            jq

          echo ""
          echo "========================================"
          echo "VERSÕES"
          echo "========================================"

          python --version
          pip --version
          ffmpeg -version | head -n 1
          aria2c --version | head -n 1
          git --version
          jq --version

      # ========================================
      # INSTALL PYTHON TOOLS
      # ========================================
      - name: Install Python tools
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "INSTALANDO FERRAMENTAS PYTHON"
          echo "========================================"

          python -m pip install --upgrade pip

          python -m pip install \
            crawl4ai \
            yt-dlp

          echo ""
          echo "========================================"
          echo "VERIFICANDO FERRAMENTAS PYTHON"
          echo "========================================"

          python -c "import crawl4ai; print('Crawl4AI: OK')"
          yt-dlp --version

      # ========================================
      # SETUP CRAWL4AI
      # ========================================
      - name: Setup Crawl4AI
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "CONFIGURANDO CRAWL4AI"
          echo "========================================"

          crawl4ai-setup

          echo ""
          echo "Crawl4AI configurado com sucesso."

      # ========================================
      # INSTALL OPENCODE
      # ========================================
      - name: Install OpenCode
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "INSTALANDO OPENCODE"
          echo "========================================"

          curl -fsSL https://opencode.ai/install | bash

          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

          export PATH="$HOME/.opencode/bin:$HOME/.local/bin:$PATH"

          if ! command -v opencode >/dev/null 2>&1; then
            echo "ERRO: OpenCode não foi encontrado após a instalação."
            exit 1
          fi

          echo ""
          echo "OpenCode instalado:"
          command -v opencode
          opencode --version

      # ========================================
      # RUN OPENCODE
      # ========================================
      - name: Run OpenCode and generate file
        env:
          PROMPT: ${{ inputs.prompt }}
          OUTPUT: ${{ inputs.filename }}

          # Crie este segredo no GitHub:
          # Settings > Secrets and variables > Actions > New repository secret
          #
          # Nome:
          # OPENCODE_API_KEY
          #
          # Valor:
          # chave do OpenCode Zen
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

          # Opcionalmente, crie uma variável:
          # Settings > Secrets and variables > Actions > Variables
          #
          # Nome:
          # OPENCODE_MODEL
          #
          # Se não existir, será usado o modelo abaixo:
          OPENCODE_MODEL: ${{ vars.OPENCODE_MODEL }}

        shell: bash
        run: |
          set -euo pipefail

          export PATH="$HOME/.opencode/bin:$HOME/.local/bin:$PATH"

          if [ -z "${OPENCODE_API_KEY:-}" ]; then
            echo "ERRO: o segredo OPENCODE_API_KEY não está configurado."
            echo ""
            echo "Configure uma chave do OpenCode Zen em:"
            echo "Settings > Secrets and variables > Actions"
            exit 1
          fi

          MODEL="${OPENCODE_MODEL:-opencode/mimo-v2.5-free}"

          REQUEST_FILE="${RUNNER_TEMP}/opencode-request.txt"
          STDOUT_FILE="${RUNNER_TEMP}/opencode-stdout.txt"
          STDERR_FILE="${RUNNER_TEMP}/opencode-stderr.txt"

          echo "========================================"
          echo "PREPARANDO SOLICITAÇÃO PARA O OPENCODE"
          echo "========================================"

          {
            printf '%s\n' "Você é o agente executor desta tarefa dentro do repositório atual."
            printf '%s\n' ""
            printf '%s\n' "Execute o pedido abaixo de forma completa."
            printf '%s\n' "Não apenas explique."
            printf '%s\n' "Não forneça tutorial."
            printf '%s\n' "Não mostre somente comandos."
            printf '%s\n' "Use as ferramentas disponíveis no ambiente quando necessário."
            printf '%s\n' ""
            printf '%s\n' "Diretório de trabalho:"
            printf '%s\n' "${GITHUB_WORKSPACE}"
            printf '%s\n' ""
            printf '%s\n' "O arquivo final obrigatório é:"
            printf '%s\n' "${OUTPUT}"
            printf '%s\n' ""
            printf '%s\n' "O arquivo final deve ficar na raiz do repositório."
            printf '%s\n' "Não crie arquivos auxiliares, logs, scripts, JSON, HTML ou arquivos temporários dentro do repositório."
            printf '%s\n' "Arquivos temporários, se necessários, devem ficar fora do repositório."
            printf '%s\n' ""
            printf '%s\n' "Você pode executar comandos, usar Crawl4AI, yt-dlp, aria2, ffmpeg e outras ferramentas instaladas."
            printf '%s\n' "Não baixe vídeos inteiros quando bastar descobrir uma URL de mídia."
            printf '%s\n' "Não invente URLs, dados ou resultados."
            printf '%s\n' ""
            printf '%s\n' "Se o pedido exigir a criação do arquivo, crie ou atualize diretamente o arquivo ${OUTPUT}."
            printf '%s\n' "Se você não criar o arquivo diretamente, sua saída final deverá conter somente o conteúdo integral que deve ser salvo nele."
            printf '%s\n' "Não inclua explicações, Markdown, cercas de código ou logs no conteúdo final."
            printf '%s\n' ""
            printf '%s\n' "PEDIDO DO USUÁRIO:"
            printf '%s\n' "$PROMPT"
            printf '%s\n' ""
            printf '%s\n' "Execute a tarefa agora e verifique o arquivo final antes de terminar."
          } > "${REQUEST_FILE}"

          # Remove uma versão anterior para garantir que o resultado desta
          # execução seja novo.
          rm -f -- "${OUTPUT}"

          echo ""
          echo "========================================"
          echo "EXECUTANDO OPENCODE"
          echo "========================================"
          echo "Modelo: ${MODEL}"
          echo "Arquivo esperado: ${OUTPUT}"

          set +e

          opencode run \
            --dir "${GITHUB_WORKSPACE}" \
            --model "${MODEL}" \
            --auto \
            "$(cat "${REQUEST_FILE}" )" \
            > "${STDOUT_FILE}" \
            2> "${STDERR_FILE}"

          OPENCODE_STATUS=$?

          set -e

          if [ -s "${STDERR_FILE}" ]; then
            echo ""
            echo "Saída de diagnóstico do OpenCode:"
            cat "${STDERR_FILE}"
          fi

          if [ "${OPENCODE_STATUS}" -ne 0 ]; then
            echo ""
            echo "ERRO: o OpenCode terminou com código ${OPENCODE_STATUS}."

            if [ -s "${STDOUT_FILE}" ]; then
              echo ""
              echo "Saída do OpenCode:"
              cat "${STDOUT_FILE}"
            fi

            exit "${OPENCODE_STATUS}"
          fi

          # Caso o OpenCode tenha apenas impresso o conteúdo em stdout,
          # utiliza a saída como arquivo de emergência.
          if [ ! -f "${OUTPUT}" ] || [ ! -s "${OUTPUT}" ]; then
            if [ -s "${STDOUT_FILE}" ]; then
              echo ""
              echo "O OpenCode não criou o arquivo diretamente."
              echo "Salvando a saída final do OpenCode em ${OUTPUT}."

              cp "${STDOUT_FILE}" "${OUTPUT}"
            fi
          fi

          if [ ! -f "${OUTPUT}" ]; then
            echo "ERRO: o arquivo ${OUTPUT} não foi criado."
            exit 1
          fi

          if [ ! -s "${OUTPUT}" ]; then
            echo "ERRO: o arquivo ${OUTPUT} está vazio."
            exit 1
          fi

          echo ""
          echo "Arquivo gerado com sucesso:"
          ls -lh -- "${OUTPUT}"

      # ========================================
      # VALIDATE GENERATED FILE
      # ========================================
      - name: Validate generated file
        env:
          OUTPUT: ${{ inputs.filename }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VALIDANDO ARQUIVO GERADO"
          echo "========================================"

          if [ ! -f "${OUTPUT}" ]; then
            echo "ERRO: ${OUTPUT} não existe."
            exit 1
          fi

          if [ ! -s "${OUTPUT}" ]; then
            echo "ERRO: ${OUTPUT} está vazio."
            exit 1
          fi

          if grep -q $'\000' "${OUTPUT}"; then
            echo "ERRO: o arquivo contém bytes nulos."
            exit 1
          fi

          # Validação adicional automática para playlists M3U/M3U8.
          if [[ "${OUTPUT}" =~ \.(m3u|m3u8)$ ]]; then
            echo "Extensão M3U detectada. Executando validação de playlist."

            FIRST_LINE="$(sed -n '1p' "${OUTPUT}")"

            if [ "${FIRST_LINE}" != "#EXTM3U" ]; then
              echo "ERRO: a primeira linha da playlist deve ser #EXTM3U."
              exit 1
            fi

            awk '
              BEGIN {
                errors = 0
                extinf_count = 0
                expecting_url = 0
              }

              NR == 1 {
                next
              }

              /^#EXTINF:/ {
                extinf_count++
                expecting_url = 1
                next
              }

              expecting_url == 1 {
                if ($0 !~ /^https?:\/\// ) {
                  print "ERRO: URL inválida após #EXTINF na linha " NR ":"
                  print $0
                  errors++
                }

                expecting_url = 0
                next
              }

              /^https?:\/\// {
                print "ERRO: URL sem #EXTINF correspondente na linha " NR ":"
                print $0
                errors++
                next
              }

              /^$/ {
                next
              }

              {
                print "ERRO: linha inesperada na linha " NR ":"
                print $0
                errors++
              }

              END {
                if (extinf_count == 0 ) {
                  print "ERRO: nenhuma entrada #EXTINF encontrada."
                  errors++
                }

                if (expecting_url == 1) {
                  print "ERRO: o último #EXTINF não possui URL."
                  errors++
                }

                if (errors > 0) {
                  exit 1
                }
              }
            ' "${OUTPUT}"

            echo "Playlist M3U validada com sucesso."
          else
            echo "Arquivo genérico detectado."
            echo "Validação básica concluída."
          fi

          echo ""
          echo "Tamanho final:"
          wc -c -- "${OUTPUT}"

      # ========================================
      # CHECK UNEXPECTED CHANGES
      # ========================================
      - name: Check unexpected changes
        env:
          OUTPUT: ${{ inputs.filename }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFICANDO ALTERAÇÕES NO REPOSITÓRIO"
          echo "========================================"

          git status --short

          EXTRA_FILES="$(
            git status --porcelain=v1 |
            awk -v allowed="${OUTPUT}" '
              {
                path = substr($0, 4)

                if (path != allowed) {
                  print $0
                }
              }
            '
          )"

          if [ -n "${EXTRA_FILES}" ]; then
            echo ""
            echo "ERRO: o OpenCode criou ou alterou arquivos adicionais:"
            printf '%s\n' "${EXTRA_FILES}"
            echo ""
            echo "Somente ${OUTPUT} pode ser alterado."
            exit 1
          fi

          echo ""
          echo "OK: somente ${OUTPUT} foi alterado."

      # ========================================
      # COMMIT AND PUSH
      # ========================================
      - name: Commit generated file safely
        env:
          OUTPUT: ${{ inputs.filename }}
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "PREPARANDO COMMIT"
          echo "========================================"

          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          BRANCH="${GITHUB_REF_NAME}"

          git add -- "${OUTPUT}"

          STAGED_FILES="$(
            git diff --cached --name-only
          )"

          if [ -n "${STAGED_FILES}" ] && [ "${STAGED_FILES}" != "${OUTPUT}" ]; then
            echo "ERRO: existem arquivos adicionais no commit:"
            printf '%s\n' "${STAGED_FILES}"
            exit 1
          fi

          if git diff --cached --quiet -- "${OUTPUT}"; then
            echo "Nenhuma alteração nova em ${OUTPUT}."
            exit 0
          fi

          git commit --only "${OUTPUT}" \
            -m "Atualiza arquivo gerado pelo OpenCode"

          echo ""
          echo "Commit criado."
          git log -1 --oneline

          for i in 1 2 3 4 5; do
            echo ""
            echo "========================================"
            echo "TENTATIVA ${i} DE PUSH"
            echo "========================================"

            if git push origin "HEAD:${BRANCH}"; then
              echo ""
              echo "PUSH CONCLUÍDO COM SUCESSO."
              exit 0
            fi

            echo "Push rejeitado. Atualizando branch remota..."

            if ! git fetch origin "${BRANCH}"; then
              echo "Fetch falhou."
              sleep 5
              continue
            fi

            if git rebase "origin/${BRANCH}"; then
              echo "Rebase concluído."
            else
              echo "ERRO: conflito durante o rebase."

              if [ -d ".git/rebase-merge" ] || [ -d ".git/rebase-apply" ]; then
                git rebase --abort || true
              fi

              exit 1
            fi

            sleep 3
          done

          echo ""
          echo "ERRO: todas as tentativas de push falharam."
          exit 1
