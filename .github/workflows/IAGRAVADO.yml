name: IA GRAVADO

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */8 * * *"

concurrency:
  group: newsworld-playlist
  cancel-in-progress: false

jobs:
  playlist:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write

    env:
      OUTPUT_FILE: lista30.M3U

    steps:
      # ========================================
      # CHECKOUT
      # ========================================
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: false
          show-progress: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # ========================================
      # SETUP PYTHON
      # ========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ========================================
      # INSTALL SYSTEM TOOLS
      # ========================================
      - name: Install system tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            aria2 \
            curl \
            wget \
            git \
            jq

          echo "Ferramentas do sistema instaladas."

          python --version
          pip --version
          ffmpeg -version | head -n 1
          aria2c --version | head -n 1
          git --version
          jq --version

      # ========================================
      # INSTALL PYTHON TOOLS
      # ========================================
      - name: Install Python tools
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          python -m pip install \
            crawl4ai \
            yt-dlp

          python -c "import crawl4ai; print('Crawl4AI instalado com sucesso')"
          yt-dlp --version

      # ========================================
      # SETUP CRAWL4AI
      # ========================================
      - name: Setup Crawl4AI
        shell: bash
        run: |
          set -euo pipefail

          crawl4ai-setup

          echo "Crawl4AI configurado com sucesso."

      # ========================================
      # VERIFY IA.TXT
      # ========================================
      - name: Verify ia.txt
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f ia.txt ]; then
            echo "ERRO: o arquivo ia.txt não existe."
            exit 1
          fi

          TOTAL_LINKS="$(
            sed '/^[[:space:]]*$/d' ia.txt | wc -l
          )"

          echo "Links encontrados: ${TOTAL_LINKS}"

          if [ "${TOTAL_LINKS}" -lt 29 ]; then
            echo "ERRO: ia.txt precisa possuir pelo menos 29 links."
            exit 1
          fi

          echo ""
          echo "Primeiros 29 links:"
          sed '/^[[:space:]]*$/d' ia.txt | sed -n '1,29p'

      # ========================================
      # GENERATE PLAYLIST WITHOUT AI OR API
      # ========================================
      - name: Generate playlist
        shell: bash
        run: |
          set -euo pipefail

          rm -f -- "${OUTPUT_FILE}"

          cat > "${RUNNER_TEMP}/generate_playlist.py" <<'PYTHON'
          import asyncio
          import html
          import re
          import subprocess
          import sys
          from contextlib import AsyncExitStack
          from pathlib import Path
          from urllib.parse import urljoin, urlparse

          from crawl4ai import AsyncWebCrawler, BrowserConfig


          INPUT_FILE = Path("ia.txt")
          OUTPUT_FILE = Path("lista30.M3U")

          MEDIA_EXTENSIONS = (
              ".m3u8",
              ".mp4",
              ".m4v",
              ".webm",
              ".mov",
              ".ts",
              ".mp3",
              ".m4a",
              ".aac",
          )

          URL_PATTERN = re.compile(
              r"https?://[^\s\"'<>\\]+",
              re.IGNORECASE,
           )


          def is_http_url(value: str ) -> bool:
              try:
                  parsed = urlparse(value)
                  return parsed.scheme in {"http", "https"} and bool(parsed.netloc )
              except Exception:
                  return False


          def clean_url(value: str) -> str:
              value = html.unescape(value)
              value = value.replace("\\/", "/")
              value = value.strip()

              while value and value[-1] in ".,;:)]}'\"":
                  value = value[:-1]

              return value


          def is_media_url(value: str) -> bool:
              lower = value.lower().split("#", 1)[0]

              if any(lower.endswith(ext) for ext in MEDIA_EXTENSIONS):
                  return True

              query = urlparse(value).query.lower()

              return any(
                  f".{ext}" in query
                  for ext in (
                      "m3u8",
                      "mp4",
                      "m4v",
                      "webm",
                      "mov",
                      "ts",
                      "mp3",
                      "m4a",
                  )
              )


          def run_ytdlp(url: str) -> str | None:
              command = [
                  sys.executable,
                  "-m",
                  "yt_dlp",
                  "--quiet",
                  "--no-warnings",
                  "--no-playlist",
                  "--skip-download",
                  "--get-url",
                  "--format",
                  "best",
                  url,
              ]

              try:
                  result = subprocess.run(
                      command,
                      capture_output=True,
                      text=True,
                      timeout=75,
                      check=False,
                  )
              except subprocess.TimeoutExpired:
                  return None
              except Exception:
                  return None

              candidates = []

              for line in result.stdout.splitlines():
                  line = clean_url(line)

                  if is_http_url(line ):
                      candidates.append(line)

              if not candidates:
                  return None

              return candidates[-1]


          def extract_media_candidates(page_url: str, content: str) -> list[str]:
              content = html.unescape(content)
              content = content.replace("\\/", "/")

              candidates = []

              for match in URL_PATTERN.findall(content):
                  candidate = clean_url(match)

                  if not is_http_url(candidate ):
                      continue

                  if is_media_url(candidate):
                      candidates.append(candidate)

              relative_pattern = re.compile(
                  r"""(?:src|href|file|url|source)\s*[:=]\s*["']([^"']+)["']""",
                  re.IGNORECASE,
              )

              for match in relative_pattern.findall(content):
                  candidate = clean_url(urljoin(page_url, match))

                  if not is_http_url(candidate ):
                      continue

                  if is_media_url(candidate):
                      candidates.append(candidate)

              unique = []
              seen = set()

              for candidate in candidates:
                  if candidate not in seen:
                      seen.add(candidate)
                      unique.append(candidate)

              return unique


          async def crawl_for_media(crawler, page_url: str) -> str | None:
              try:
                  result = await crawler.arun(url=page_url)
              except Exception as exc:
                  print(f"Crawl4AI falhou para {page_url}: {exc}")
                  return None

              contents = []

              for attribute in ("html", "cleaned_html", "markdown"):
                  value = getattr(result, attribute, None)

                  if value:
                      contents.append(str(value))

              for content in contents:
                  candidates = extract_media_candidates(page_url, content)

                  for candidate in candidates:
                      resolved = run_ytdlp(candidate)

                      if resolved and is_http_url(resolved ):
                          return resolved

                      if is_http_url(candidate ):
                          return candidate

              return None


          async def main() -> None:
              if not INPUT_FILE.exists():
                  raise RuntimeError("ia.txt não existe.")

              links = [
                  line.strip()
                  for line in INPUT_FILE.read_text(
                      encoding="utf-8",
                      errors="replace",
                  ).splitlines()
                  if line.strip()
              ][:29]

              successes = []
              failures = 0
              crawler = None

              async with AsyncExitStack() as stack:
                  for index, source_url in enumerate(links, start=1):
                      print(f"[{index}/29] Analisando: {source_url}")

                      media_url = run_ytdlp(source_url)

                      if media_url and is_http_url(media_url ):
                          successes.append((index, media_url))
                          print(f"[{index}/29] Mídia encontrada via yt-dlp.")
                          continue

                      if crawler is None:
                          try:
                              crawler = await stack.enter_async_context(
                                  AsyncWebCrawler(
                                      config=BrowserConfig(headless=True)
                                  )
                              )
                          except Exception as exc:
                              print(f"Crawl4AI não pôde ser iniciado: {exc}")
                              crawler = False

                      if crawler:
                          media_url = await crawl_for_media(crawler, source_url)

                      if media_url and is_http_url(media_url ):
                          successes.append((index, media_url))
                          print(f"[{index}/29] Mídia encontrada via Crawl4AI.")
                      else:
                          failures += 1
                          print(f"[{index}/29] Nenhuma mídia utilizável encontrada.")

              lines = ["#EXTM3U"]

              for item_number, media_url in successes:
                  lines.append(
                      f'#EXTINF:-1 tvg-logo="" group-title="VOD",Item {item_number}'
                  )
                  lines.append(media_url)

              OUTPUT_FILE.write_text(
                  "\n".join(lines) + "\n",
                  encoding="utf-8",
              )

              print("")
              print("========================================")
              print("RESULTADO")
              print("========================================")
              print(f"Links encontrados: {len(links)}")
              print(f"Links analisados: {len(links)}")
              print(f"Sucessos: {len(successes)}")
              print(f"Falhas: {failures}")
              print(f"Entradas criadas: {len(successes)}")
              print("Ferramentas utilizadas: yt-dlp e Crawl4AI")
              print(f"Arquivo criado: {OUTPUT_FILE}")


          if __name__ == "__main__":
              asyncio.run(main())
          PYTHON

          python "${RUNNER_TEMP}/generate_playlist.py"

          if [ ! -f "${OUTPUT_FILE}" ]; then
            echo "ERRO: ${OUTPUT_FILE} não foi criado."
            exit 1
          fi

          if [ ! -s "${OUTPUT_FILE}" ]; then
            echo "ERRO: ${OUTPUT_FILE} está vazio."
            exit 1
          fi

          ls -lh -- "${OUTPUT_FILE}"

      # ========================================
      # VALIDATE PLAYLIST
      # ========================================
      - name: Validate playlist
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VALIDANDO PLAYLIST"
          echo "========================================"

          if [ ! -f "${OUTPUT_FILE}" ]; then
            echo "ERRO: arquivo não encontrado."
            exit 1
          fi

          if [ ! -s "${OUTPUT_FILE}" ]; then
            echo "ERRO: arquivo vazio."
            exit 1
          fi

          FIRST_LINE="$(sed -n '1p' "${OUTPUT_FILE}")"

          if [ "${FIRST_LINE}" != "#EXTM3U" ]; then
            echo "ERRO: a primeira linha deve ser #EXTM3U."
            exit 1
          fi

          EXTINF_COUNT="$(
            grep -c '^#EXTINF:' "${OUTPUT_FILE}" || true
          )"

          if [ "${EXTINF_COUNT}" -eq 0 ]; then
            echo "ERRO: nenhuma entrada #EXTINF encontrada."
            exit 1
          fi

          VOD_COUNT="$(
            grep -c 'group-title="VOD"' "${OUTPUT_FILE}" || true
          )"

          if [ "${VOD_COUNT}" -ne "${EXTINF_COUNT}" ]; then
            echo "ERRO: existem entradas sem group-title=\"VOD\"."
            exit 1
          fi

          awk '
            BEGIN {
              errors = 0
              expecting_url = 0
            }

            NR == 1 {
              next
            }

            /^#EXTINF:/ {
              expecting_url = 1
              next
            }

            expecting_url == 1 {
              if ($0 !~ /^https?:\/\// ) {
                print "ERRO: URL inválida após #EXTINF na linha " NR ":"
                print $0
                errors++
              }

              expecting_url = 0
              next
            }

            /^https?:\/\// {
              print "ERRO: URL sem #EXTINF correspondente na linha " NR ":"
              print $0
              errors++
              next
            }

            /^$/ {
              next
            }

            {
              print "ERRO: linha inesperada na linha " NR ":"
              print $0
              errors++
            }

            END {
              if (expecting_url == 1 ) {
                print "ERRO: o último #EXTINF não possui URL."
                errors++
              }

              if (errors > 0) {
                exit 1
              }
            }
          ' "${OUTPUT_FILE}"

          MARKDOWN="$(
            grep -E '^```|^\[[^]]+\]\(https?://' "${OUTPUT_FILE}" || true
           )"

          if [ -n "${MARKDOWN}" ]; then
            echo "ERRO: Markdown encontrado na playlist."
            exit 1
          fi

          ERRORS="$(
            grep -Ei 'erro|error|falha|failed|exception' "${OUTPUT_FILE}" || true
          )"

          if [ -n "${ERRORS}" ]; then
            echo "ERRO: mensagens de erro encontradas na playlist."
            echo "${ERRORS}"
            exit 1
          fi

          echo ""
          echo "Playlist validada com sucesso."
          echo "Entradas: ${EXTINF_COUNT}"
          echo "URLs: $(grep -cE '^https?://' "${OUTPUT_FILE}" || true )"

      # ========================================
      # CHECK UNEXPECTED CHANGES
      # ========================================
      - name: Check unexpected changes
        shell: bash
        run: |
          set -euo pipefail

          git status --short

          EXTRA_FILES="$(
            git status --porcelain=v1 |
            awk -v allowed="${OUTPUT_FILE}" '
              {
                path = substr($0, 4)

                if (path != allowed) {
                  print $0
                }
              }
            '
          )"

          if [ -n "${EXTRA_FILES}" ]; then
            echo ""
            echo "ERRO: arquivos adicionais foram criados ou alterados:"
            printf '%s\n' "${EXTRA_FILES}"
            exit 1
          fi

          echo "OK: somente ${OUTPUT_FILE} foi alterado."

      # ========================================
      # COMMIT AND PUSH
      # ========================================
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          BRANCH="${GITHUB_REF_NAME}"

          git add -- "${OUTPUT_FILE}"

          if git diff --cached --quiet -- "${OUTPUT_FILE}"; then
            echo "Nenhuma alteração nova na playlist."
            exit 0
          fi

          git commit --only "${OUTPUT_FILE}" \
            -m "Atualiza playlist automaticamente"

          for i in 1 2 3 4 5; do
            echo "Tentativa ${i} de push."

            if git push origin "HEAD:${BRANCH}"; then
              echo "Push concluído com sucesso."
              exit 0
            fi

            echo "Push falhou. Atualizando branch remota."

            git fetch origin "${BRANCH}"

            if ! git rebase "origin/${BRANCH}"; then
              echo "ERRO: conflito durante o rebase."
              git rebase --abort || true
              exit 1
            fi

            sleep 3
          done

          echo "ERRO: todas as tentativas de push falharam."
          exit 1
