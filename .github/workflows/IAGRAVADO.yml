name: IA GRAVADO

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */8 * * *"

concurrency:
  group: newsworld-playlist
  cancel-in-progress: false

jobs:
  playlist:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write

    steps:

      # ========================================
      # CHECKOUT
      # ========================================
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: false
          show-progress: true
          token: ${{ secrets.GITHUB_TOKEN }}


      # ========================================
      # SETUP PYTHON
      # ========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ========================================
      # INSTALL SYSTEM TOOLS
      # ========================================
      - name: Install system tools
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "INSTALANDO FERRAMENTAS DO SISTEMA"
          echo "========================================"

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            aria2 \
            curl \
            wget \
            git

          echo ""
          echo "========================================"
          echo "VERSÕES"
          echo "========================================"

          python --version
          pip --version
          ffmpeg -version | head -n 1
          aria2c --version | head -n 1
          git --version


      # ========================================
      # INSTALL PYTHON TOOLS
      # ========================================
      - name: Install Python tools
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "INSTALANDO PYTHON TOOLS"
          echo "========================================"

          python -m pip install --upgrade pip

          python -m pip install \
            crawl4ai \
            yt-dlp

          echo ""
          echo "========================================"
          echo "VERIFICANDO PYTHON TOOLS"
          echo "========================================"

          python -c "import crawl4ai; print('Crawl4AI: OK')"
          yt-dlp --version


      # ========================================
      # SETUP CRAWL4AI
      # ========================================
      - name: Setup Crawl4AI
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "CONFIGURANDO CRAWL4AI"
          echo "========================================"

          if command -v crawl4ai >/dev/null 2>&1; then
            echo "Executável crawl4ai encontrado."
            crawl4ai --help >/dev/null 2>&1 || true
          else
            echo "Executável crawl4ai não encontrado."
          fi

          echo ""
          echo "Tentando inicialização do Crawl4AI..."

          crawl4ai-setup || true

          echo ""
          echo "Crawl4AI configurado."


      # ========================================
      # INSTALL OPENCODE
      # ========================================
      - name: Install OpenCode
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "INSTALANDO OPENCODE"
          echo "========================================"

          curl -fsSL https://opencode.ai/install | bash

          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

          export PATH="$HOME/.opencode/bin:$HOME/.local/bin:$PATH"

          echo ""
          echo "========================================"
          echo "VERIFICANDO OPENCODE"
          echo "========================================"

          if ! command -v opencode >/dev/null 2>&1; then
            echo "ERRO: OpenCode não foi encontrado após instalação."
            exit 1
          fi

          command -v opencode
          opencode --version


      # ========================================
      # VERIFY IA.TXT
      # ========================================
      - name: Verify ia.txt
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFICANDO IA.TXT"
          echo "========================================"

          if [ ! -f ia.txt ]; then
            echo "ERRO: ia.txt não existe."
            exit 1
          fi

          TOTAL=$(sed '/^[[:space:]]*$/d' ia.txt | wc -l)

          echo "Links encontrados: $TOTAL"

          if [ "$TOTAL" -lt 29 ]; then
            echo "ERRO: ia.txt precisa possuir pelo menos 29 links."
            exit 1
          fi

          echo ""
          echo "Primeiros 29 links:"

          sed '/^[[:space:]]*$/d' ia.txt | sed -n '1,29p'


      # ========================================
      # REMOVE OLD PLAYLIST
      # ========================================
      - name: Remove old playlist
        shell: bash
        run: |
          set -euo pipefail

          rm -f lista30.M3U

          echo "Playlist anterior removida."


      # ========================================
      # OPENCODE EXECUTION
      # ========================================
      - name: OpenCode generates IPTV playlist
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail

          export PATH="$HOME/.opencode/bin:$HOME/.local/bin:$PATH"

          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "ERRO: OPENAI_API_KEY não configurada."
            exit 1
          fi

          if ! command -v opencode >/dev/null 2>&1; then
            echo "ERRO: OpenCode não está disponível."
            exit 1
          fi

          echo "========================================"
          echo "EXECUTANDO OPENCODE"
          echo "========================================"

          opencode run '
          Você é o agente responsável por executar esta tarefa inteira no ambiente atual do GitHub Actions.

          NÃO apenas explique.
          NÃO forneça tutorial.
          NÃO apenas mostre comandos.

          EXECUTE a tarefa.

          ==================================================
          OBJETIVO
          ==================================================

          O arquivo ia.txt contém URLs.

          Sua missão é pegar SOMENTE os primeiros 29 links
          NÃO VAZIOS de ia.txt e transformá-los em uma playlist
          IPTV/M3U.

          O arquivo final obrigatório é:

          lista30.M3U

          Ele deve ser criado na raiz do repositório.

          ==================================================
          REGRAS DOS LINKS
          ==================================================

          Leia ia.txt.

          Ignore linhas vazias.

          Considere somente os primeiros 29 links não vazios.

          NÃO processe um 30º link.

          Para cada um dos 29 links:

          1. Analise a URL.
          2. Determine o tipo de conteúdo.
          3. Use Crawl4AI quando necessário.
          4. Use yt-dlp quando apropriado.
          5. Use ffmpeg ou outras ferramentas somente quando necessário.
          6. Tente encontrar uma URL real de mídia utilizável.
          7. Não invente URLs.
          8. Não crie URLs falsas.
          9. Se o link falhar, registre a falha fora da playlist.
          10. Continue processando os outros links.

          ==================================================
          CRAWL4AI
          ==================================================

          Crawl4AI é OBRIGATÓRIO.

          Verifique se está disponível.

          Use Crawl4AI para análise das páginas quando necessário,
          especialmente quando a URL não for diretamente uma mídia.

          Não baixe vídeos inteiros desnecessariamente.

          Prefira descobrir URLs de mídia/streaming.

          ==================================================
          YT-DLP
          ==================================================

          Use yt-dlp quando a URL for compatível.

          Prefira obter informações e URLs de mídia sem baixar
          o conteúdo completo.

          Não invente resultados.

          ==================================================
          PLAYLIST IPTV
          ==================================================

          O resultado precisa ser uma playlist M3U válida.

          A primeira linha obrigatoriamente deve ser:

          #EXTM3U

          Cada entrada deve possuir exatamente este conceito:

          #EXTINF:-1 tvg-logo="" group-title="VOD",Item N
          URL

          Exemplo:

          #EXTM3U
          #EXTINF:-1 tvg-logo="" group-title="VOD",Item 1
          https://exemplo.com/video1.mp4
          #EXTINF:-1 tvg-logo="" group-title="VOD",Item 2
          https://exemplo.com/video2.mp4

          ==================================================
          REGRAS DA PLAYLIST
          ==================================================

          - Nome obrigatório: lista30.M3U
          - Local obrigatório: raiz do repositório
          - Primeira linha: #EXTM3U
          - Cada entrada deve ter #EXTINF
          - Cada #EXTINF deve ser seguido imediatamente por uma URL
          - Toda entrada deve possuir group-title="VOD"
          - URLs devem começar com http:// ou https://
          - Não colocar Markdown
          - Não colocar logs
          - Não colocar erros
          - Não colocar comentários
          - Não colocar explicações
          - Não colocar URLs falsas
          - Não criar entradas para links que falharam
          - Não processar mais de 29 links

          ==================================================
          QUANTIDADE
          ==================================================

          Podem existir menos de 29 entradas na playlist.

          Isso é permitido se alguns dos 29 links não produzirem
          uma URL de mídia real.

          NÃO invente URLs para tentar chegar a 29 entradas.

          ==================================================
          VALIDAÇÃO
          ==================================================

          Depois de criar lista30.M3U, valide completamente.

          Verifique:

          1. arquivo existe;
          2. arquivo não está vazio;
          3. primeira linha é exatamente #EXTM3U;
          4. existem entradas #EXTINF;
          5. cada #EXTINF possui URL na linha seguinte;
          6. cada URL começa com http:// ou https://;
          7. todas as entradas possuem group-title="VOD";
          8. não existem mensagens de erro;
          9. não existem blocos Markdown;
          10. não existem URLs inventadas;
          11. não existem linhas de URL sem #EXTINF correspondente;
          12. não existem arquivos auxiliares na raiz do repositório.
          13. não baixe nenhum video para meu computador.

          Se encontrar problema, corrija lista30.M3U.

          ==================================================
          LIMPEZA
          ==================================================

          O único arquivo que pode ser alterado no repositório é:

          lista30.M3U

          NÃO altere:

          ia.txt

          NÃO crie:

          logs
          JSON
          TXT
          HTML
          scripts
          arquivos temporários
          arquivos de debug

          Arquivos temporários devem ficar fora do repositório.

          ==================================================
          RESUMO
          ==================================================

          Ao terminar, mostre no terminal:

          - total de links encontrados;
          - quantidade de links analisados;
          - quantidade de sucessos;
          - quantidade de falhas;
          - quantidade de entradas em lista30.M3U;
          - ferramentas utilizadas;
          - confirmação da validação.

          Execute a tarefa completamente agora.
          '


      # ========================================
      # VALIDATE PLAYLIST
      # ========================================
      - name: Validate lista30.M3U
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VALIDANDO LISTA30.M3U"
          echo "========================================"

          if [ ! -f lista30.M3U ]; then
            echo "ERRO: lista30.M3U não foi criado."
            exit 1
          fi

          if [ ! -s lista30.M3U ]; then
            echo "ERRO: lista30.M3U está vazio."
            exit 1
          fi

          FIRST_LINE=$(sed -n '1p' lista30.M3U)

          if [ "$FIRST_LINE" != "#EXTM3U" ]; then
            echo "ERRO: arquivo não começa com #EXTM3U."
            exit 1
          fi

          EXTINF_COUNT=$(grep -c '^#EXTINF:' lista30.M3U || true)

          if [ "$EXTINF_COUNT" -eq 0 ]; then
            echo "ERRO: nenhuma entrada #EXTINF encontrada."
            exit 1
          fi

          VOD_COUNT=$(grep -c 'group-title="VOD"' lista30.M3U || true)

          if [ "$VOD_COUNT" -ne "$EXTINF_COUNT" ]; then
            echo "ERRO: existem entradas sem group-title=\"VOD\"."
            exit 1
          fi

          BAD_EXTINF=$(grep '^#EXTINF:' lista30.M3U |
            grep -v 'group-title="VOD"' ||
            true)

          if [ -n "$BAD_EXTINF" ]; then
            echo "ERRO: entrada #EXTINF inválida."
            echo "$BAD_EXTINF"
            exit 1
          fi

          echo ""
          echo "Verificando pares #EXTINF + URL..."

          awk '
          BEGIN {
            errors = 0
            extinf = 0
          }

          NR == 1 {
            if ($0 != "#EXTM3U") {
              print "ERRO: primeira linha inválida."
              errors++
            }
            next
          }

          /^#EXTINF:/ {
            extinf++
            nextline = 1
            next
          }

          nextline == 1 {
            if ($0 !~ /^https?:\/\//) {
              print "ERRO: URL inválida após #EXTINF na linha " NR ":"
              print $0
              errors++
            }

            nextline = 0
            next
          }

          /^https?:\/\// {
            next
          }

          {
            if ($0 != "") {
              print "ERRO: linha inesperada na linha " NR ":"
              print $0
              errors++
            }
          }

          END {
            if (nextline == 1) {
              print "ERRO: último #EXTINF não possui URL."
              errors++
            }

            if (errors > 0) {
              exit 1
            }

            print "Pares #EXTINF + URL: OK"
          }
          ' lista30.M3U

          HTTP_URLS=$(grep -E '^https?://' lista30.M3U || true)

          if [ -z "$HTTP_URLS" ]; then
            echo "ERRO: nenhuma URL HTTP/HTTPS encontrada."
            exit 1
          fi

          MARKDOWN=$(grep -E '^```|^\[[^]]+\]\(https?://' lista30.M3U || true)

          if [ -n "$MARKDOWN" ]; then
            echo "ERRO: Markdown encontrado na playlist."
            echo "$MARKDOWN"
            exit 1
          fi

          ERRORS=$(grep -Ei 'erro|error|falha|failed|exception' lista30.M3U || true)

          if [ -n "$ERRORS" ]; then
            echo "ERRO: mensagens de erro encontradas na playlist."
            echo "$ERRORS"
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "RESULTADO"
          echo "========================================"

          echo "Entradas #EXTINF: $EXTINF_COUNT"
          echo "URLs: $(grep -cE '^https?://' lista30.M3U || true)"
          echo "VOD: $VOD_COUNT"

          echo ""
          echo "========================================"
          echo "PLAYLIST GERADA"
          echo "========================================"

          cat lista30.M3U

          echo ""
          echo "========================================"
          echo "PLAYLIST VALIDADA COM SUCESSO"
          echo "========================================"


      # ========================================
      # CHECK UNEXPECTED CHANGES
      # ========================================
      - name: Check unexpected changes
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "VERIFICANDO ALTERAÇÕES"
          echo "========================================"

          git status --short

          EXTRA_FILES=$(
            git status --porcelain=v1 |
            awk '
              {
                status=substr($0,1,2)
                path=substr($0,4)

                if (path != "lista30.M3U") {
                  print $0
                }
              }
            '
          )

          if [ -n "$EXTRA_FILES" ]; then
            echo ""
            echo "ERRO: arquivos adicionais foram alterados/criados:"
            printf '%s\n' "$EXTRA_FILES"
            exit 1
          fi

          echo ""
          echo "OK: somente lista30.M3U foi alterado."


      # ========================================
      # COMMIT + PUSH
      # ========================================
      - name: Commit and Push safely
        shell: bash
        run: |
          set -euo pipefail

          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          BRANCH="${GITHUB_REF_NAME}"

          echo "Branch: $BRANCH"

          git add -- lista30.M3U

          if git diff --cached --quiet -- lista30.M3U; then
            echo "Nenhuma alteração na playlist."
            exit 0
          fi

          git commit --only lista30.M3U \
            -m "Atualização automática da playlist"

          for i in {1..10}; do

            echo ""
            echo "========================================"
            echo "Tentativa $i de 10"
            echo "========================================"

            if timeout 60s git fetch origin "$BRANCH"; then
              echo "Fetch OK."
            else
              echo "Fetch falhou."
              sleep 5
              continue
            fi

            if timeout 60s git rebase "origin/$BRANCH"; then
              echo "Rebase OK."
            else
              echo "Rebase falhou."

              if [ -d .git/rebase-merge ] ||
                 [ -d .git/rebase-apply ]; then
                git rebase --abort || true
              fi

              sleep 5
              continue
            fi

            if timeout 60s git push origin "HEAD:$BRANCH"; then

              echo ""
              echo "========================================"
              echo "PUSH CONCLUÍDO COM SUCESSO"
              echo "========================================"

              exit 0

            fi

            echo "Push falhou."
            sleep 5

          done

          echo ""
          echo "ERRO: todas as tentativas de push falharam."

          exit 1
