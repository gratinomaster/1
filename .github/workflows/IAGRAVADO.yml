name: IA GRAVADO

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */8 * * *"

concurrency:
  group: newsworld-playlist
  cancel-in-progress: false

jobs:
  playlist:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write

    steps:

      # ========================================
      # CHECKOUT
      # ========================================
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Checkout raso: o workflow só precisa do estado atual para gerar a playlist.
          # O fetch posterior atualiza a referência remota antes do rebase/push.
          fetch-depth: 1
          fetch-tags: false
          show-progress: true
          token: ${{ secrets.GITHUB_TOKEN }}


      # ========================================
      # INSTALL FFMPEG + YT-DLP
      # ========================================
      - name: Install FFmpeg and yt-dlp
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Instalando FFmpeg"
          echo "========================================"

          sudo apt-get update
          sudo apt-get install -y ffmpeg

          echo ""
          echo "========================================"
          echo "Instalando yt-dlp"
          echo "========================================"

          python3 -m pip install --user -U yt-dlp

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

          echo ""
          echo "========================================"
          echo "Verificando FFmpeg"
          echo "========================================"

          command -v ffmpeg
          ffmpeg -version | head -1

          echo ""
          echo "========================================"
          echo "Verificando yt-dlp"
          echo "========================================"

          command -v yt-dlp
          yt-dlp --version


      # ========================================
      # VERIFY IA.TXT
      # ========================================
      - name: Verify ia.txt
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Verificando ia.txt"
          echo "========================================"

          if [ ! -f ia.txt ]; then
            echo "ERRO: ia.txt não existe."
            exit 1
          fi

          TOTAL=$(sed '/^[[:space:]]*$/d' ia.txt | wc -l)

          echo "Links não vazios encontrados: $TOTAL"

          if [ "$TOTAL" -lt 29 ]; then
            echo "ERRO: ia.txt possui menos de 29 links."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "Primeiros 29 links"
          echo "========================================"

          sed '/^[[:space:]]*$/d' ia.txt | sed -n '1,29p'

          echo ""
          echo "Verificação concluída."



      # ========================================
      # GENERATE PLAYLIST DIRECTLY
      # ========================================
      - name: Generate playlist with yt-dlp
        shell: bash
        run: |
          set -euo pipefail

          OUTPUT="lista30.M3U"
          TMP_OUTPUT="$RUNNER_TEMP/lista30.M3U.tmp"
          ERROR_LOG="$RUNNER_TEMP/yt-dlp-errors.txt"

          : > "$ERROR_LOG"
          printf '%s\n' '#EXTM3U' > "$TMP_OUTPUT"

          TOTAL=0
          SUCCESS=0
          FAILURES=0

          while IFS= read -r URL; do
            # Remove espaços no início e no fim da linha.
            URL="${URL#"${URL%%[![:space:]]*}"}"
            URL="${URL%"${URL##*[![:space:]]}"}"

            [ -z "$URL" ] && continue

            TOTAL=$((TOTAL + 1))
            [ "$TOTAL" -gt 29 ] && break

            echo "Processando link $TOTAL de 29..."

            MEDIA_URL="$(
              timeout 45s yt-dlp \
                --no-warnings \
                --no-playlist \
                --get-url \
                --format 'best[protocol^=http]/best' \
                -- "$URL" 2>> "$ERROR_LOG" \
              | sed -n '1p' \
              || true
            )"

            if [[ "$MEDIA_URL" =~ ^https?:// ]]; then
              printf '#EXTINF:-1 tvg-logo="" group-title="VOD",Item %d\n%s\n' \
                "$TOTAL" "$MEDIA_URL" >> "$TMP_OUTPUT"
              SUCCESS=$((SUCCESS + 1))
              echo "Link $TOTAL processado com sucesso."
            else
              FAILURES=$((FAILURES + 1))
              printf 'Falha no link %d: %s\n' "$TOTAL" "$URL" >> "$ERROR_LOG"
              echo "Link $TOTAL falhou; continuando."
            fi
          done < ia.txt

          if [ "$TOTAL" -eq 0 ]; then
            echo "ERRO: nenhum link não vazio foi encontrado em ia.txt."
            exit 1
          fi

          mv "$TMP_OUTPUT" "$OUTPUT"

          echo ""
          echo "========================================"
          echo "Resumo do processamento"
          echo "========================================"
          echo "Links analisados: $TOTAL"
          echo "Processados com sucesso: $SUCCESS"
          echo "Falhas: $FAILURES"

          # O log fica fora do repositório para não bloquear o commit.
          if [ -s "$ERROR_LOG" ]; then
            echo "Foram registradas falhas em $ERROR_LOG."
          fi



      # ========================================
      # VALIDATE PLAYLIST
      # ========================================
      - name: Validate generated playlist
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Arquivos no diretório"
          echo "========================================"

          ls -lah

          echo ""
          echo "========================================"
          echo "Verificando lista30.M3U"
          echo "========================================"

          if [ ! -f lista30.M3U ]; then
            echo "ERRO: lista30.M3U não foi criado."
            exit 1
          fi

          if [ ! -s lista30.M3U ]; then
            echo "ERRO: lista30.M3U está vazio."
            exit 1
          fi

          echo "lista30.M3U existe e não está vazio."

          echo ""
          echo "========================================"
          echo "Primeiras linhas da playlist"
          echo "========================================"

          sed -n '1,30p' lista30.M3U

          echo ""
          echo "========================================"
          echo "Validação M3U"
          echo "========================================"

          if ! grep -q '^#EXTM3U' lista30.M3U; then
            echo "ERRO: lista30.M3U não possui #EXTM3U."
            exit 1
          fi

          EXTINF_COUNT=$(grep -c '^#EXTINF:' lista30.M3U || true)

          echo "Quantidade de #EXTINF: $EXTINF_COUNT"

          if [ "$EXTINF_COUNT" -eq 0 ]; then
            echo "ERRO: nenhuma entrada #EXTINF encontrada."
            exit 1
          fi

          if ! grep -q 'group-title="VOD"' lista30.M3U; then
            echo "ERRO: group-title=\"VOD\" não encontrado."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "PLAYLIST VALIDADA COM SUCESSO"
          echo "========================================"


      # ========================================
      # GIT STATUS
      # ========================================
      - name: Show git changes
        shell: bash
        run: |
          echo "========================================"
          echo "Git status"
          echo "========================================"

          git status --short


      # ========================================
      # COMMIT + PUSH
      # ========================================
      - name: Commit and Push safely
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Configurando Git"
          echo "========================================"

          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          echo ""
          echo "Branch:"
          git branch --show-current

          echo ""
          echo "Remote:"
          git remote -v

          echo ""
          echo "========================================"
          echo "Limpando artefatos temporários"
          echo "========================================"

          # Um processo de geração pode criar err.txt ao registrar falhas do yt-dlp.
          # Remove-o somente quando ele for um arquivo não rastreado.
          # Se err.txt fizer parte do repositório, não o apaga.
          if [ -f err.txt ] && ! git ls-files --error-unmatch -- err.txt >/dev/null 2>&1; then
            rm -f -- err.txt
          fi

          echo ""
          echo "========================================"
          echo "Adicionando somente lista30.M3U"
          echo "========================================"

          git add -- lista30.M3U

          if git diff --cached --quiet -- lista30.M3U; then
            echo "Nenhuma alteração na playlist."
            exit 0
          fi

          # O commit deve conter somente a playlist. Qualquer outro arquivo
          # inesperado faz o workflow falhar para evitar commit indevido.
          EXTRA_FILES=$(git status --porcelain=v1 \
            | sed -E 's/^.. //' \
            | grep -Fvx 'lista30.M3U' || true)

          if [ -n "$EXTRA_FILES" ]; then
            echo "ERRO: existem alterações adicionais além de lista30.M3U."
            printf '%s\n' "$EXTRA_FILES"
            git status --short
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "Criando commit somente da playlist"
          echo "========================================"

          git commit --only lista30.M3U -m "Atualização automática da playlist"

          BRANCH=$(git rev-parse --abbrev-ref HEAD)

          echo "Branch: $BRANCH"

          echo ""
          echo "========================================"
          echo "Iniciando push"
          echo "========================================"

          for i in {1..10}; do

            echo ""
            echo "========================================"
            echo "Tentativa $i de 10"
            echo "========================================"

            echo "Fetch..."

            if timeout 60s git fetch origin "$BRANCH"; then
              echo "Fetch OK."
            else
              echo "Fetch falhou ou expirou."
              sleep 5
              continue
            fi

            echo ""
            echo "Rebase..."

            if timeout 60s git rebase "origin/$BRANCH"; then
              echo "Rebase OK."
            else
              echo "Rebase falhou."

              # Só tenta abortar quando um rebase realmente foi iniciado.
              if [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
                git rebase --abort || true
              fi

              sleep 5
              continue
            fi

            echo ""
            echo "Push..."

            if timeout 60s git push origin "HEAD:$BRANCH"; then

              echo ""
              echo "========================================"
              echo "PUSH CONCLUÍDO COM SUCESSO!"
              echo "========================================"

              exit 0

            else

              echo "Push falhou ou expirou."
              sleep 5

            fi

          done

          echo ""
          echo "========================================"
          echo "ERRO"
          echo "========================================"

          echo "Todas as 10 tentativas de push falharam."

          exit 1
