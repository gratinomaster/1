name: IA GRAVADO

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */8 * * *"

concurrency:
  group: newsworld-playlist
  cancel-in-progress: false

jobs:
  playlist:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write

    env:
      OUTPUT_FILE: lista30.M3U
      MAX_ENTRIES: "29"

    steps:
      # ========================================
      # CHECKOUT
      # ========================================
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: false
          show-progress: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # ========================================
      # SETUP PYTHON
      # ========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ========================================
      # INSTALL SYSTEM TOOLS
      # ========================================
      - name: Install system tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            aria2 \
            curl \
            wget \
            git

          echo "Ferramentas instaladas."

          python --version
          pip --version
          ffmpeg -version | head -n 1
          aria2c --version | head -n 1
          git --version

      # ========================================
      # INSTALL PYTHON TOOLS
      # ========================================
      - name: Install Python tools
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          python -m pip install \
            crawl4ai \
            yt-dlp \
            beautifulsoup4

          python -c "import crawl4ai; print('Crawl4AI: OK' )"
          python -c "import bs4; print('BeautifulSoup: OK')"
          yt-dlp --version

      # ========================================
      # SETUP CRAWL4AI
      # ========================================
      - name: Setup Crawl4AI
        shell: bash
        run: |
          set -euo pipefail

          crawl4ai-setup

          echo "Crawl4AI configurado."

      # ========================================
      # VERIFY IA.TXT
      # ========================================
      - name: Verify ia.txt
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f ia.txt ]; then
            echo "ERRO: ia.txt não existe."
            exit 1
          fi

          TOTAL_LINKS="$(
            sed '/^[[:space:]]*$/d' ia.txt | wc -l
          )"

          echo "Links de origem encontrados: ${TOTAL_LINKS}"

          if [ "${TOTAL_LINKS}" -lt 1 ]; then
            echo "ERRO: ia.txt está vazio."
            exit 1
          fi

          echo ""
          echo "Links que serão usados como origem:"
          sed '/^[[:space:]]*$/d' ia.txt | sed -n '1,29p'

      # ========================================
      # GENERATE PLAYLIST
      # ========================================
      - name: Generate playlist from profiles and items
        shell: bash
        run: |
          set -euo pipefail

          rm -f -- "${OUTPUT_FILE}"

          cat > "${RUNNER_TEMP}/generate_playlist.py" <<'PYTHON'
          import asyncio
          import html
          import json
          import re
          import subprocess
          import sys
          from contextlib import AsyncExitStack
          from pathlib import Path
          from urllib.parse import (
              parse_qsl,
              quote,
              unquote,
              urlencode,
              urljoin,
              urlparse,
              urlunparse,
          )
          from urllib.request import Request, urlopen

          from bs4 import BeautifulSoup
          from crawl4ai import AsyncWebCrawler, BrowserConfig


          INPUT_FILE = Path("ia.txt")
          OUTPUT_FILE = Path("lista30.M3U")
          MAX_ENTRIES = 29

          USER_AGENT = (
              "Mozilla/5.0 (X11; Linux x86_64) "
              "AppleWebKit/537.36 "
              "Chrome/120 Safari/537.36"
          )

          MEDIA_EXTENSIONS = (
              ".m3u8",
              ".mp4",
              ".m4v",
              ".webm",
              ".mov",
              ".ts",
              ".mp3",
              ".m4a",
              ".aac",
              ".avi",
              ".mkv",
          )

          URL_PATTERN = re.compile(
              r"https?://[^\s\"'<>\\]+",
              re.IGNORECASE,
           )


          def is_http_url(value: str ) -> bool:
              try:
                  parsed = urlparse(value)

                  return (
                      parsed.scheme in {"http", "https"}
                      and bool(parsed.netloc )
                  )
              except Exception:
                  return False


          def clean_url(value: str) -> str:
              value = html.unescape(value)
              value = value.replace("\\/", "/")
              value = value.strip()

              while value and value[-1] in ".,;:)]}'\"":
                  value = value[:-1]

              return value


          def clean_text(value: str) -> str:
              value = html.unescape(value or "")
              value = re.sub(r"\s+", " ", value)
              value = value.replace("\x00", "")
              return value.strip()


          def escape_m3u_attribute(value: str) -> str:
              value = clean_text(value)
              return value.replace('"', "'")


          def is_media_url(value: str) -> bool:
              lower = value.lower().split("#", 1)[0]

              if any(lower.endswith(ext) for ext in MEDIA_EXTENSIONS):
                  return True

              query = urlparse(value).query.lower()

              return any(
                  f".{extension}" in query
                  for extension in (
                      "m3u8",
                      "mp4",
                      "m4v",
                      "webm",
                      "mov",
                      "ts",
                      "mp3",
                      "m4a",
                      "avi",
                      "mkv",
                  )
              )


          def is_archive_url(value: str) -> bool:
              try:
                  hostname = urlparse(value).netloc.lower()

                  return (
                      hostname == "archive.org"
                      or hostname.endswith(".archive.org")
                  )
              except Exception:
                  return False


          def archive_identifier(source_url: str) -> str | None:
              if not is_archive_url(source_url):
                  return None

              parsed = urlparse(source_url)

              parts = [
                  unquote(part)
                  for part in parsed.path.split("/")
                  if part
              ]

              if len(parts) < 2:
                  return None

              if parts[0].lower() != "details":
                  return None

              identifier = parts[1]

              if identifier.startswith("@"):
                  return None

              return identifier


          def is_archive_profile(source_url: str) -> bool:
              if not is_archive_url(source_url):
                  return False

              parsed = urlparse(source_url)

              parts = [
                  unquote(part)
                  for part in parsed.path.split("/")
                  if part
              ]

              return (
                  len(parts) == 2
                  and parts[0].lower() == "details"
                  and parts[1].startswith("@")
              )


          def canonical_item_url(source_url: str) -> str | None:
              identifier = archive_identifier(source_url)

              if not identifier:
                  return None

              return (
                  "https://archive.org/details/"
                  + quote(identifier, safe="" )
              )


          def page_url_with_number(
              source_url: str,
              page_number: int,
          ) -> str:
              parsed = urlparse(source_url)

              query = dict(parse_qsl(parsed.query))
              query["page"] = str(page_number)

              return urlunparse(
                  (
                      parsed.scheme,
                      parsed.netloc,
                      parsed.path,
                      parsed.params,
                      urlencode(query),
                      parsed.fragment,
                  )
              )


          def fetch_html(page_url: str) -> str:
              request = Request(
                  page_url,
                  headers={"User-Agent": USER_AGENT},
              )

              try:
                  with urlopen(request, timeout=30) as response:
                      content_type = (
                          response.headers.get("Content-Type", "")
                          .lower()
                      )

                      if "text/html" not in content_type:
                          return ""

                      data = response.read(4_000_000)

                      charset = response.headers.get_content_charset()
                      encoding = charset or "utf-8"

                      return data.decode(
                          encoding,
                          errors="replace",
                      )

              except Exception as exc:
                  print(
                      f"Não foi possível ler {page_url}: {exc}"
                  )
                  return ""


          def valid_image_url(image_url: str) -> bool:
              if not is_http_url(image_url ):
                  return False

              lower_url = image_url.lower().split("?", 1)[0]

              if lower_url.endswith(".svg"):
                  return False

              request = Request(
                  image_url,
                  headers={
                      "User-Agent": USER_AGENT,
                      "Range": "bytes=0-4096",
                  },
              )

              try:
                  with urlopen(request, timeout=20) as response:
                      content_type = (
                          response.headers.get("Content-Type", "")
                          .lower()
                      )

                      return (
                          content_type.startswith("image/")
                          and "svg" not in content_type
                      )

              except Exception:
                  return False


          def metadata_from_html(
              page_url: str,
              page_html: str,
          ) -> tuple[str | None, str | None]:
              if not page_html:
                  return None, None

              soup = BeautifulSoup(
                  page_html,
                  "html.parser",
              )

              title = None

              # Título principal dos itens do Internet Archive.
              item_title = soup.select_one("h1.item-title")

              if item_title:
                  title = clean_text(
                      item_title.get_text(
                          " ",
                          strip=True,
                      )
                  )

              # Título Open Graph para outras páginas.
              if not title:
                  meta_title = soup.find(
                      "meta",
                      attrs={"property": "og:title"},
                  )

                  if meta_title:
                      title = clean_text(
                          meta_title.get("content", "")
                      )

              # Último recurso para o título.
              if not title and soup.title:
                  title = clean_text(
                      soup.title.get_text(
                          " ",
                          strip=True,
                      )
                  )

              if title:
                  title = re.sub(
                      r"\s*:\s*Free Download.*$",
                      "",
                      title,
                      flags=re.IGNORECASE,
                  ).strip()

                  title = re.sub(
                      r"\s*:\s*Internet Archive.*$",
                      "",
                      title,
                      flags=re.IGNORECASE,
                  ).strip()

              logo = None

              image_selectors = (
                  {"property": "og:image"},
                  {"name": "twitter:image"},
                  {"property": "twitter:image"},
              )

              for selector in image_selectors:
                  image = soup.find(
                      "meta",
                      attrs=selector,
                  )

                  if not image:
                      continue

                  image_content = image.get("content", "")

                  if not image_content:
                      continue

                  candidate = urljoin(
                      page_url,
                      clean_url(image_content),
                  )

                  if valid_image_url(candidate):
                      logo = candidate
                      break

              return title or None, logo


          def extract_item_links(
              page_url: str,
              contents: list[str],
          ) -> list[str]:
              found = []
              seen = set()

              def add_candidate(candidate: str) -> None:
                  candidate = clean_url(
                      urljoin(page_url, candidate)
                  )

                  item_url = canonical_item_url(candidate)

                  if not item_url:
                      return

                  if is_archive_profile(candidate):
                      return

                  if item_url in seen:
                      return

                  seen.add(item_url)
                  found.append(item_url)

              for content in contents:
                  if not content:
                      continue

                  soup = BeautifulSoup(
                      content,
                      "html.parser",
                  )

                  for anchor in soup.select("a[href]"):
                      add_candidate(anchor.get("href", ""))

                  for match in re.findall(
                      r"(?:https://archive\.org )?/details/[^\s\"'<>]+",
                      content,
                      flags=re.IGNORECASE,
                  ):
                      add_candidate(match)

              return found


          async def crawl_page(
              crawler,
              page_url: str,
          ) -> list[str]:
              try:
                  result = await crawler.arun(url=page_url)

              except Exception as exc:
                  print(
                      f"Crawl4AI falhou ao abrir {page_url}: {exc}"
                  )
                  return []

              contents = []

              for attribute in (
                  "html",
                  "cleaned_html",
                  "markdown",
              ):
                  value = getattr(result, attribute, None)

                  if value:
                      contents.append(str(value))

              return contents


          async def expand_archive_profile(
              crawler,
              profile_url: str,
          ) -> list[str]:
              items = []
              seen = set()

              print(f"Expandindo perfil: {profile_url}")

              # O perfil tem muitas páginas. Dez páginas são suficientes
              # para encontrar 29 itens na maioria dos casos.
              for page_number in range(1, 11):
                  page_url = page_url_with_number(
                      profile_url,
                      page_number,
                  )

                  contents = await crawl_page(
                      crawler,
                      page_url,
                  )

                  page_items = extract_item_links(
                      page_url,
                      contents,
                  )

                  before = len(items)

                  for item_url in page_items:
                      if item_url in seen:
                          continue

                      seen.add(item_url)
                      items.append(item_url)

                      if len(items) >= MAX_ENTRIES:
                          break

                  print(
                      f"Página {page_number}: "
                      f"{len(items) - before} itens novos"
                  )

                  if len(items) >= MAX_ENTRIES:
                      break

                  if not page_items:
                      break

              print(
                  f"Total de itens encontrados no perfil: {len(items)}"
              )

              return items[:MAX_ENTRIES]


          def get_item_metadata(
              item_url: str,
          ) -> tuple[str | None, str | None]:
              page_html = fetch_html(item_url)

              return metadata_from_html(
                  item_url,
                  page_html,
              )


          def fetch_archive_metadata(identifier: str) -> dict:
              metadata_url = (
                  "https://archive.org/metadata/"
                  + quote(identifier, safe="")
              )

              request = Request(
                  metadata_url,
                  headers={"User-Agent": USER_AGENT},
              )

              try:
                  with urlopen(request, timeout=60) as response:
                      raw = response.read(25_000_000)

                  return json.loads(
                      raw.decode("utf-8", errors="replace")
                  )

              except Exception as exc:
                  print(
                      f"Não foi possível ler metadados do Archive "
                      f"{identifier}: {exc}"
                  )
                  return {}


          def expand_archive_item(
              source_url: str,
              limit: int,
          ) -> list[dict]:
              identifier = archive_identifier(source_url)

              if not identifier or limit <= 0:
                  return []

              item_url = canonical_item_url(source_url) or source_url
              item_title, item_logo = get_item_metadata(item_url)

              if not item_logo:
                  fallback_logo = (
                      "https://archive.org/services/img/"
                      + quote(identifier, safe="")
                  )

                  if valid_image_url(fallback_logo):
                      item_logo = fallback_logo

              metadata = fetch_archive_metadata(identifier)
              files = metadata.get("files", [])

              preferred = []
              fallback = []

              for entry in files:
                  if not isinstance(entry, dict):
                      continue

                  name = clean_text(str(entry.get("name", "")))
                  lower_name = name.lower()

                  if not name:
                      continue

                  # Prioriza MP4 derivados H.264 para a playlist.
                  if (
                      lower_name.endswith(".mp4")
                      and entry.get("source") == "derivative"
                  ):
                      preferred.append(entry)
                      continue

                  # Se necessário, usa MP4 originais.
                  if (
                      lower_name.endswith(".mp4")
                      and entry.get("source") == "original"
                  ):
                      fallback.append(entry)
                      continue

                  # Último recurso: outros contêineres de vídeo.
                  if lower_name.endswith((".m4v", ".webm", ".mov", ".ts")):
                      fallback.append(entry)

              ordered_files = preferred + fallback
              result = []
              seen_names = set()

              for entry in ordered_files:
                  name = clean_text(str(entry.get("name", "")))

                  if not name or name in seen_names:
                      continue

                  seen_names.add(name)

                  media_url = (
                      "https://archive.org/download/"
                      + quote(identifier, safe="")
                      + "/"
                      + quote(name, safe="")
                  )

                  title = clean_text(
                      Path(name).stem.replace("_", " ")
                  )

                  if not title:
                      title = item_title or identifier

                  result.append(
                      {
                          "item_url": item_url,
                          "media_url": media_url,
                          "title": title,
                          "logo": item_logo,
                      }
                  )

                  if len(result) >= limit:
                      break

              print(
                  f"Arquivos de mídia encontrados em {identifier}: "
                  f"{len(result)}"
              )

              return result


          def run_ytdlp_media(
              source_url: str,
          ) -> str | None:
              command = [
                  sys.executable,
                  "-m",
                  "yt_dlp",
                  "--quiet",
                  "--no-warnings",
                  "--no-playlist",
                  "--skip-download",
                  "--get-url",
                  "--format",
                  "best",
                  source_url,
              ]

              try:
                  result = subprocess.run(
                      command,
                      capture_output=True,
                      text=True,
                      timeout=90,
                      check=False,
                  )

              except subprocess.TimeoutExpired:
                  print(
                      f"yt-dlp excedeu o tempo: {source_url}"
                  )
                  return None

              except Exception as exc:
                  print(
                      f"Erro no yt-dlp: {exc}"
                  )
                  return None

              candidates = []

              for line in result.stdout.splitlines():
                  candidate = clean_url(line)

                  if is_http_url(candidate ):
                      candidates.append(candidate)

              if not candidates:
                  return None

              return candidates[-1]


          def run_ytdlp_title(
              source_url: str,
          ) -> str | None:
              command = [
                  sys.executable,
                  "-m",
                  "yt_dlp",
                  "--quiet",
                  "--no-warnings",
                  "--no-playlist",
                  "--skip-download",
                  "--get-title",
                  source_url,
              ]

              try:
                  result = subprocess.run(
                      command,
                      capture_output=True,
                      text=True,
                      timeout=60,
                      check=False,
                  )

              except Exception:
                  return None

              titles = [
                  clean_text(line)
                  for line in result.stdout.splitlines()
                  if clean_text(line)
              ]

              return titles[-1] if titles else None


          def extract_media_candidates(
              page_url: str,
              contents: list[str],
          ) -> list[str]:
              candidates = []
              seen = set()

              for content in contents:
                  content = html.unescape(content)
                  content = content.replace("\\/", "/")

                  for match in URL_PATTERN.findall(content):
                      candidate = clean_url(match)

                      if not is_http_url(candidate ):
                          continue

                      if not is_media_url(candidate):
                          continue

                      if candidate not in seen:
                          seen.add(candidate)
                          candidates.append(candidate)

                  relative_pattern = re.compile(
                      r"""(?:src|href|file|url|source)\s*[:=]\s*["']([^"']+)["']""",
                      re.IGNORECASE,
                  )

                  for match in relative_pattern.findall(content):
                      candidate = clean_url(
                          urljoin(page_url, match)
                      )

                      if not is_http_url(candidate ):
                          continue

                      if not is_media_url(candidate):
                          continue

                      if candidate not in seen:
                          seen.add(candidate)
                          candidates.append(candidate)

              return candidates


          async def media_from_item_page(
              crawler,
              item_url: str,
          ) -> tuple[str | None, str | None, str | None]:
              contents = await crawl_page(
                  crawler,
                  item_url,
              )

              title = None
              logo = None

              for content in contents:
                  found_title, found_logo = metadata_from_html(
                      item_url,
                      content,
                  )

                  title = title or found_title
                  logo = logo or found_logo

              for candidate in extract_media_candidates(
                  item_url,
                  contents,
              ):
                  resolved = run_ytdlp_media(candidate)

                  if resolved and is_http_url(resolved ):
                      return resolved, title, logo

                  if is_http_url(candidate ):
                      return candidate, title, logo

              return None, title, logo


          async def main() -> None:
              if not INPUT_FILE.exists():
                  raise RuntimeError("ia.txt não existe.")

              source_links = [
                  line.strip()
                  for line in INPUT_FILE.read_text(
                      encoding="utf-8",
                      errors="replace",
                  ).splitlines()
                  if line.strip()
              ][:MAX_ENTRIES]

              crawler = None
              successes = []
              failures = 0
              seen_items = set()
              seen_media = set()

              async with AsyncExitStack() as stack:
                  crawler = await stack.enter_async_context(
                      AsyncWebCrawler(
                          config=BrowserConfig(
                              headless=True
                          )
                      )
                  )

                  item_specs = []
                  seen_specs = set()

                  for source_url in source_links:
                      remaining = MAX_ENTRIES - len(item_specs)

                      if remaining <= 0:
                          break

                      # Um /details/ID contém vários arquivos; expanda o item.
                      if archive_identifier(source_url):
                          archive_specs = expand_archive_item(
                              source_url,
                              remaining,
                          )

                          for spec in archive_specs:
                              media_url = spec["media_url"]

                              if media_url in seen_specs:
                                  continue

                              seen_specs.add(media_url)
                              item_specs.append(spec)

                          continue

                      # Perfis continuam sendo expandidos por páginas.
                      if is_archive_profile(source_url):
                          profile_items = await expand_archive_profile(
                              crawler,
                              source_url,
                          )

                          for item_url in profile_items:
                              if item_url in seen_items:
                                  continue

                              seen_items.add(item_url)
                              item_specs.append(
                                  {
                                      "item_url": item_url,
                                      "media_url": None,
                                      "title": None,
                                      "logo": None,
                                  }
                              )

                              if len(item_specs) >= MAX_ENTRIES:
                                  break

                          continue

                      item_url = canonical_item_url(source_url) or source_url

                      if item_url in seen_items:
                          continue

                      seen_items.add(item_url)
                      item_specs.append(
                          {
                              "item_url": item_url,
                              "media_url": None,
                              "title": None,
                              "logo": None,
                          }
                      )

                  print("")
                  print(
                      f"Itens individuais para processar: "
                      f"{len(item_specs)}"
                  )

                  for index, spec in enumerate(
                      item_specs,
                      start=1,
                  ):
                      item_url = spec["item_url"]
                      if len(successes) >= MAX_ENTRIES:
                          break

                      print(
                          f"[{index}/{len(item_specs)}] "
                          f"Processando {item_url}"
                      )

                      title = spec.get("title")
                      logo = spec.get("logo")
                      media_url = spec.get("media_url")

                      if not media_url:
                          title, logo = get_item_metadata(
                              item_url
                          )

                          media_url = run_ytdlp_media(
                              item_url
                          )

                      if not media_url:
                          (
                              media_url,
                              crawled_title,
                              crawled_logo,
                          ) = await media_from_item_page(
                              crawler,
                              item_url,
                          )

                          title = title or crawled_title
                          logo = logo or crawled_logo

                      if not title:
                          title = run_ytdlp_title(
                              item_url
                          )

                      if not media_url:
                          failures += 1
                          print(
                              "Falha: mídia não encontrada."
                          )
                          continue

                      if not is_http_url(media_url ):
                          failures += 1
                          print(
                              "Falha: URL de mídia inválida."
                          )
                          continue

                      if not title:
                          failures += 1
                          print(
                              "Falha: título não encontrado."
                          )
                          continue

                      if not logo or not valid_image_url(logo):
                          failures += 1
                          print(
                              "Falha: tvg-logo real não encontrado."
                          )
                          continue

                      if media_url in seen_media:
                          print(
                              "Ignorado: mídia duplicada."
                          )
                          continue

                      seen_media.add(media_url)

                      successes.append(
                          {
                              "title": title,
                              "logo": logo,
                              "media": media_url,
                          }
                      )

                      print(
                          f"Sucesso: {title}"
                      )

              if not successes:
                  raise RuntimeError(
                      "Nenhuma entrada válida foi encontrada."
                  )

              lines = ["#EXTM3U"]

              for item in successes:
                  title = escape_m3u_attribute(
                      item["title"]
                  )

                  logo = escape_m3u_attribute(
                      item["logo"]
                  )

                  media = item["media"]

                  lines.append(
                      '#EXTINF:-1 '
                      f'tvg-name="{title}" '
                      f'tvg-logo="{logo}" '
                      'group-title="VOD",'
                      f"{title}"
                  )

                  lines.append(media)

              OUTPUT_FILE.write_text(
                  "\n".join(lines) + "\n",
                  encoding="utf-8",
              )

              print("")
              print("========================================")
              print("RESULTADO")
              print("========================================")
              print(
                  f"Fontes lidas: {len(source_links)}"
              )
              print(
                  f"Itens individuais encontrados: "
                  f"{len(item_specs)}"
              )
              print(
                  f"Entradas criadas: {len(successes)}"
              )
              print(
                  f"Falhas: {failures}"
              )
              print(
                  "Títulos: metadata pública das páginas"
              )
              print(
                  "Logos: og:image público das páginas"
              )
              print(
                  "Ferramentas: Crawl4AI, yt-dlp e BeautifulSoup"
              )


          if __name__ == "__main__":
              asyncio.run(main())
          PYTHON

          python "${RUNNER_TEMP}/generate_playlist.py"

          if [ ! -f "${OUTPUT_FILE}" ]; then
            echo "ERRO: ${OUTPUT_FILE} não foi criado."
            exit 1
          fi

          if [ ! -s "${OUTPUT_FILE}" ]; then
            echo "ERRO: ${OUTPUT_FILE} está vazio."
            exit 1
          fi

          ls -lh -- "${OUTPUT_FILE}"

      # ========================================
      # VALIDATE PLAYLIST
      # ========================================
      - name: Validate playlist
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "${OUTPUT_FILE}" ]; then
            echo "ERRO: arquivo não encontrado."
            exit 1
          fi

          if [ ! -s "${OUTPUT_FILE}" ]; then
            echo "ERRO: arquivo vazio."
            exit 1
          fi

          FIRST_LINE="$(sed -n '1p' "${OUTPUT_FILE}")"

          if [ "${FIRST_LINE}" != "#EXTM3U" ]; then
            echo "ERRO: a primeira linha deve ser #EXTM3U."
            exit 1
          fi

          EXTINF_COUNT="$(
            grep -c '^#EXTINF:' "${OUTPUT_FILE}" || true
          )"

          URL_COUNT="$(
            grep -cE '^https?://' "${OUTPUT_FILE}" || true
           )"

          if [ "${EXTINF_COUNT}" -eq 0 ]; then
            echo "ERRO: nenhuma entrada encontrada."
            exit 1
          fi

          if [ "${EXTINF_COUNT}" -gt "${MAX_ENTRIES}" ]; then
            echo "ERRO: mais de ${MAX_ENTRIES} entradas."
            exit 1
          fi

          if [ "${URL_COUNT}" -ne "${EXTINF_COUNT}" ]; then
            echo "ERRO: quantidade de URLs diferente da quantidade de entradas."
            exit 1
          fi

          if grep -E '^#EXTINF:.*tvg-logo=""' \
            "${OUTPUT_FILE}" >/dev/null; then
            echo "ERRO: existe entrada sem tvg-logo."
            exit 1
          fi

          if grep -E '^#EXTINF:' "${OUTPUT_FILE}" |
            grep -Ev 'tvg-logo="https?://[^"]+"' >/dev/null; then
            echo "ERRO: existe tvg-logo inválido."
            exit 1
          fi

          if grep -E '^#EXTINF:.*tvg-name=""' \
            "${OUTPUT_FILE}" >/dev/null; then
            echo "ERRO: existe título vazio."
            exit 1
          fi

          if grep -E '^#EXTINF:.*tvg-logo="[^"]+\.svg' \
            "${OUTPUT_FILE}" >/dev/null; then
            echo "ERRO: logo SVG não permitido."
            exit 1
          fi

          if grep -E '^#EXTINF:.*group-title="VOD"' \
            "${OUTPUT_FILE}" >/dev/null; then
            echo "group-title=VOD: OK"
          else
            echo "ERRO: group-title=VOD não encontrado."
            exit 1
          fi

          awk '
            BEGIN {
              errors = 0
              expecting_url = 0
            }

            NR == 1 {
              next
            }

            /^#EXTINF:/ {
              expecting_url = 1
              next
            }

            expecting_url == 1 {
              if ($0 !~ /^https?:\/\// ) {
                print "ERRO: URL inválida após #EXTINF na linha " NR
                errors++
              }

              expecting_url = 0
              next
            }

            /^https?:\/\// {
              print "ERRO: URL sem #EXTINF na linha " NR
              errors++
              next
            }

            /^$/ {
              next
            }

            {
              print "ERRO: linha inesperada na linha " NR
              errors++
            }

            END {
              if (expecting_url == 1 ) {
                print "ERRO: último #EXTINF sem URL."
                errors++
              }

              if (errors > 0) {
                exit 1
              }
            }
          ' "${OUTPUT_FILE}"

          echo ""
          echo "Playlist validada."
          echo "Entradas: ${EXTINF_COUNT}"
          echo "URLs: ${URL_COUNT}"

      # ========================================
      # CHECK UNEXPECTED CHANGES
      # ========================================
      - name: Check unexpected changes
        shell: bash
        run: |
          set -euo pipefail

          git status --short

          EXTRA_FILES="$(
            git status --porcelain=v1 |
            awk -v allowed="${OUTPUT_FILE}" '
              {
                path = substr($0, 4)

                if (path != allowed) {
                  print $0
                }
              }
            '
          )"

          if [ -n "${EXTRA_FILES}" ]; then
            echo "ERRO: arquivos extras alterados:"
            printf '%s\n' "${EXTRA_FILES}"
            exit 1
          fi

          echo "OK: somente ${OUTPUT_FILE} foi alterado."

      # ========================================
      # COMMIT AND PUSH
      # ========================================
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          BRANCH="${GITHUB_REF_NAME}"

          git add -- "${OUTPUT_FILE}"

          if git diff --cached --quiet -- "${OUTPUT_FILE}"; then
            echo "Nenhuma alteração nova."
            exit 0
          fi

          git commit --only "${OUTPUT_FILE}" \
            -m "Atualiza playlist com titulos e logos"

          for i in 1 2 3 4 5; do
            echo "Tentativa ${i} de push."

            if git push origin "HEAD:${BRANCH}"; then
              echo "Push concluído."
              exit 0
            fi

            echo "Push falhou. Sincronizando branch."

            git fetch origin "${BRANCH}"

            if ! git rebase "origin/${BRANCH}"; then
              echo "ERRO: conflito durante rebase."
              git rebase --abort || true
              exit 1
            fi

            sleep 3
          done

          echo "ERRO: todas as tentativas de push falharam."
          exit 1
