name: IA GRAVADO

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */8 * * *"

concurrency:
  group: newsworld-playlist
  cancel-in-progress: false

jobs:
  opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Create prompt
        run: |
          cat << 'EOF' > prompt.txt
          exclua todos arquivos do meu computador que sejam logs do ffmpeg
          acesse ia.txt
          pegue os 29 primeiros links e transforme em conteudo que podera ser assistido no vlc
          salve no lista30.M3U
          estilo #extinf com tvg-logo e group-title="VOD"
          use yt-dlp
          EOF

      - name: Run OpenCode
        run: |
          echo "Executando OpenCode..."
          timeout 5m opencode run "$(cat prompt.txt)"

      - name: Check generated files
        run: |
          echo "Arquivos no diretório:"
          ls -la

          if [ -f lista30.M3U ]; then
            echo "Playlist criada:"
            cat lista30.M3U
          else
            echo "ERRO: lista30.M3U não foi criado"
            exit 1
          fi

      - name: Commit and Push safely
        run: |
          set -u

          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git status
          git branch --show-current
          git remote -v

          git add .

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commit."
            exit 0
          fi

          git commit -m "Atualização automática da playlist"

          BRANCH=$(git rev-parse --abbrev-ref HEAD)

          for i in {1..10}; do
            echo "========================================"
            echo "Tentativa $i de push..."
            echo "========================================"

            echo "Fetch..."

            if timeout 30s git fetch origin "$BRANCH"; then
              echo "Fetch OK."
            else
              echo "Fetch expirou ou falhou."
              sleep 5
              continue
            fi

            echo "Rebase..."

            if timeout 30s git rebase "origin/$BRANCH"; then
              echo "Rebase OK."
            else
              echo "Rebase falhou."
              git rebase --abort || true
              sleep 5
              continue
            fi

            echo "Push..."

            if timeout 30s git push origin "HEAD:$BRANCH"; then
              echo "========================================"
              echo "PUSH CONCLUÍDO COM SUCESSO!"
              echo "========================================"
              exit 0
            else
              echo "Push falhou ou expirou."
              sleep 5
            fi
          done

          echo "ERRO: todas as 10 tentativas falharam."
          exit 1
