name: IA GRAVADO

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */8 * * *"

concurrency:
  group: newsworld-playlist
  cancel-in-progress: false

jobs:
  opencode:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install OpenCode
        run: |
          curl -fsSL https://opencode.ai/install | bash
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

      - name: Create prompt
        run: |
          cat << 'EOF' > prompt.txt
          exclua todos arquivos do meu computador que sejam logs do ffmpeg
          acesse ia.txt
          pegue os 2 primeiros links e transforme em conteudo que podera ser assistido no vlc
          salve no lista30.M3U
          estilo #extinf com tvg-logo e group-title="VOD"
          EOF

      - name: Run OpenCode
        run: |
          echo "Executando OpenCode..."
          opencode run "$(cat prompt.txt)"

      - name: Check generated files
        run: |
          echo "Arquivos no diretório:"
          ls -la

          if [ -f lista30.M3U ]; then
            echo "Playlist criada:"
            cat lista30.M3U
          else
            echo "ERRO: lista30.M3U não foi criado"
            exit 1
          fi

      - name: Commit and Push safely
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u

          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          echo "========================================"
          echo "Verificando estado do Git"
          echo "========================================"

          git status
          git branch --show-current
          git remote -v

          echo "========================================"
          echo "Adicionando arquivos"
          echo "========================================"

          git add .

          if git diff --cached --quiet; then
            echo "Nenhuma alteração para commit."
            exit 0
          fi

          git commit -m "Atualização automática da playlist"

          BRANCH=$(git rev-parse --abbrev-ref HEAD)

          echo "Branch atual: $BRANCH"

          echo "========================================"
          echo "Iniciando tentativas de sincronização"
          echo "========================================"

          for i in {1..10}; do
            echo ""
            echo "========================================"
            echo "Tentativa $i de push..."
            echo "========================================"

            echo "1. Atualizando informações do GitHub..."

            if timeout 60s git fetch origin "$BRANCH"; then
              echo "Fetch concluído."
            else
              echo "ERRO: git fetch demorou mais de 60 segundos."
              echo "Tentativa $i interrompida."
              sleep 5
              continue
            fi

            echo "2. Verificando diferenças..."

            git status

            echo "3. Fazendo rebase..."

            if timeout 60s git rebase "origin/$BRANCH"; then
              echo "Rebase concluído."
            else
              echo "ERRO: conflito ou falha no rebase."

              git rebase --abort || true

              echo "Aguardando 5 segundos..."
              sleep 5
              continue
            fi

            echo "4. Fazendo push..."

            if timeout 60s git push origin "HEAD:$BRANCH"; then
              echo ""
              echo "========================================"
              echo "PUSH CONCLUÍDO COM SUCESSO!"
              echo "========================================"
              exit 0
            else
              echo ""
              echo "Push falhou ou ultrapassou 60 segundos."
              echo "Aguardando 5 segundos antes da próxima tentativa..."
              sleep 5
            fi
          done

          echo ""
          echo "========================================"
          echo "ERRO: PUSH NÃO CONCLUÍDO"
          echo "========================================"
          echo "Todas as 10 tentativas falharam."
          exit 1
