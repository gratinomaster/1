name: IA GRAVADO

on:
  workflow_dispatch:

  # Executa automaticamente a cada 8 horas.
  schedule:
    - cron: "0 */8 * * *"

concurrency:
  group: newsworld-playlist
  cancel-in-progress: false

jobs:
  opencode:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: write

    env:
      OUTPUT_FILE: lista30.M3U
      OPENCODE_MODEL: opencode/mimo-v2.5-free

    steps:
      # ========================================
      # CHECKOUT
      # ========================================
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: false
          show-progress: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # ========================================
      # SETUP PYTHON
      # ========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ========================================
      # INSTALL SYSTEM TOOLS
      # ========================================
      - name: Install system tools
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            aria2 \
            curl \
            wget \
            git \
            jq

          echo "Ferramentas do sistema instaladas."

          python --version
          pip --version
          ffmpeg -version | head -n 1
          aria2c --version | head -n 1
          git --version
          jq --version

      # ========================================
      # INSTALL PYTHON TOOLS
      # ========================================
      - name: Install Python tools
        shell: bash
        run: |
          set -euo pipefail

          python -m pip install --upgrade pip

          python -m pip install \
            crawl4ai \
            yt-dlp

          python -c "import crawl4ai; print('Crawl4AI instalado com sucesso')"
          yt-dlp --version

      # ========================================
      # SETUP CRAWL4AI
      # ========================================
      - name: Setup Crawl4AI
        shell: bash
        run: |
          set -euo pipefail

          crawl4ai-setup

          echo "Crawl4AI configurado com sucesso."

      # ========================================
      # VERIFY IA.TXT
      # ========================================
      - name: Verify ia.txt
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f ia.txt ]; then
            echo "ERRO: o arquivo ia.txt não existe."
            exit 1
          fi

          TOTAL_LINKS="$(
            sed '/^[[:space:]]*$/d' ia.txt | wc -l
          )"

          echo "Links encontrados: ${TOTAL_LINKS}"

          if [ "${TOTAL_LINKS}" -lt 29 ]; then
            echo "ERRO: ia.txt precisa possuir pelo menos 29 links não vazios."
            exit 1
          fi

          echo "Primeiros 29 links:"
          sed '/^[[:space:]]*$/d' ia.txt | sed -n '1,29p'

      # ========================================
      # INSTALL OPENCODE
      # ========================================
      - name: Install OpenCode
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL https://opencode.ai/install | bash

          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"

          export PATH="$HOME/.opencode/bin:$HOME/.local/bin:$PATH"

          if ! command -v opencode >/dev/null 2>&1; then
            echo "ERRO: OpenCode não foi encontrado."
            exit 1
          fi

          opencode --version

      # ========================================
      # RUN OPENCODE WITH FIXED PROMPT
      # ========================================
      - name: Run OpenCode
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          export PATH="$HOME/.opencode/bin:$HOME/.local/bin:$PATH"

          if [ -z "${OPENCODE_API_KEY:-}" ]; then
            echo "ERRO: o segredo OPENCODE_API_KEY não está configurado."
            echo ""
            echo "Crie o segredo em:"
            echo "Settings > Secrets and variables > Actions > Secrets"
            exit 1
          fi

          rm -f -- "${OUTPUT_FILE}"

          # ============================================================
          # PROMPT FIXO
          # Edite somente este bloco quando quiser mudar a tarefa.
          # ============================================================
          PROMPT_FIXO="$(cat <<'PROMPT'
Você é o agente executor desta tarefa dentro do GitHub Actions.

Execute a tarefa completamente no ambiente atual.
Não apenas explique.
Não forneça tutorial.
Não mostre somente comandos.
Use as ferramentas disponíveis no ambiente.

OBJETIVO:

O arquivo ia.txt contém URLs.

Leia o arquivo ia.txt e considere SOMENTE os primeiros 29 links não vazios.

Para cada um desses 29 links:

1. Analise a URL.
2. Determine o tipo de conteúdo.
3. Use Crawl4AI quando for necessário analisar uma página.
4. Use yt-dlp quando a URL for compatível.
5. Use aria2 somente se for necessário.
6. Use ffmpeg somente se for necessário.
7. Tente descobrir uma URL real de mídia utilizável.
8. Não baixe vídeos inteiros desnecessariamente.
9. Não invente URLs.
10. Não crie URLs falsas.
11. Se um link falhar, ignore-o e continue com os demais.
12. Não processe um 30º link.

ARQUIVO FINAL OBRIGATÓRIO:

Crie este arquivo na raiz do repositório:

lista30.M3U

O arquivo precisa ser uma playlist IPTV/M3U válida.

O conteúdo deve seguir exatamente este formato:

#EXTM3U
#EXTINF:-1 tvg-logo="" group-title="VOD",Item 1
https://exemplo.com/video1.mp4

REGRAS DA PLAYLIST:

- A primeira linha deve ser exatamente #EXTM3U.
- Cada entrada deve possuir uma linha #EXTINF.
- Cada #EXTINF deve ser imediatamente seguido por uma URL.
- Toda entrada deve possuir group-title="VOD".
- As URLs devem começar com http:// ou https://.
- Não coloque Markdown.
- Não coloque cercas de código.
- Não coloque explicações.
- Não coloque logs.
- Não coloque erros.
- Não coloque comentários.
- Não coloque URLs inventadas.
- Não crie entradas para links que falharam.
- Podem existir menos de 29 entradas se alguns links não produzirem uma URL real.
- Nunca invente URLs para completar a quantidade.
- Não processe mais de 29 links.

REGRAS DE ARQUIVOS:

- O único arquivo que pode ser alterado ou criado no repositório é lista30.M3U.
- Não altere ia.txt.
- Não crie logs.
- Não crie JSON.
- Não crie TXT.
- Não crie HTML.
- Não crie scripts.
- Não crie arquivos temporários no repositório.
- Arquivos temporários devem ficar fora do repositório.
- Não baixe vídeos para o computador.

VALIDAÇÃO OBRIGATÓRIA:

Depois de criar lista30.M3U, verifique:

1. Se o arquivo existe.
2. Se o arquivo não está vazio.
3. Se a primeira linha é exatamente #EXTM3U.
4. Se existem entradas #EXTINF.
5. Se cada #EXTINF possui uma URL na linha seguinte.
6. Se todas as URLs começam com http:// ou https://.
7. Se todas as entradas possuem group-title="VOD".
8. Se não existem erros na playlist.
9. Se não existem blocos Markdown.
10. Se não existem URLs inventadas.
11. Se não existem URLs sem #EXTINF correspondente.
12. Se nenhum arquivo adicional foi criado no repositório.

Execute a tarefa agora.

No final, o arquivo lista30.M3U deve estar criado diretamente na raiz do repositório.
PROMPT
 )"

          echo "Executando OpenCode com o prompt fixo."

          OPENCODE_LOG="${RUNNER_TEMP}/opencode-output.txt"

          opencode run \
            --dir "${GITHUB_WORKSPACE}" \
            --model "${OPENCODE_MODEL}" \
            --auto \
            "${PROMPT_FIXO}" \
            > "${OPENCODE_LOG}" 2>&1

          echo "OpenCode terminou a execução."

          if [ ! -f "${OUTPUT_FILE}" ]; then
            echo "ERRO: o OpenCode não criou ${OUTPUT_FILE}."
            echo ""
            echo "Últimas mensagens do OpenCode:"
            tail -n 100 "${OPENCODE_LOG}" || true
            exit 1
          fi

          if [ ! -s "${OUTPUT_FILE}" ]; then
            echo "ERRO: ${OUTPUT_FILE} está vazio."
            exit 1
          fi

          ls -lh -- "${OUTPUT_FILE}"

      # ========================================
      # VALIDATE PLAYLIST
      # ========================================
      - name: Validate lista30.M3U
        shell: bash
        run: |
          set -euo pipefail

          echo "Validando ${OUTPUT_FILE}."

          if [ ! -f "${OUTPUT_FILE}" ]; then
            echo "ERRO: arquivo não encontrado."
            exit 1
          fi

          if [ ! -s "${OUTPUT_FILE}" ]; then
            echo "ERRO: arquivo vazio."
            exit 1
          fi

          FIRST_LINE="$(sed -n '1p' "${OUTPUT_FILE}")"

          if [ "${FIRST_LINE}" != "#EXTM3U" ]; then
            echo "ERRO: a primeira linha deve ser exatamente #EXTM3U."
            exit 1
          fi

          EXTINF_COUNT="$(
            grep -c '^#EXTINF:' "${OUTPUT_FILE}" || true
          )"

          if [ "${EXTINF_COUNT}" -eq 0 ]; then
            echo "ERRO: nenhuma entrada #EXTINF foi encontrada."
            exit 1
          fi

          VOD_COUNT="$(
            grep -c 'group-title="VOD"' "${OUTPUT_FILE}" || true
          )"

          if [ "${VOD_COUNT}" -ne "${EXTINF_COUNT}" ]; then
            echo "ERRO: existem entradas sem group-title=\"VOD\"."
            exit 1
          fi

          awk '
            BEGIN {
              errors = 0
              expecting_url = 0
            }

            NR == 1 {
              next
            }

            /^#EXTINF:/ {
              expecting_url = 1
              next
            }

            expecting_url == 1 {
              if ($0 !~ /^https?:\/\// ) {
                print "ERRO: URL inválida após #EXTINF na linha " NR ":"
                print $0
                errors++
              }

              expecting_url = 0
              next
            }

            /^https?:\/\// {
              print "ERRO: URL sem #EXTINF correspondente na linha " NR ":"
              print $0
              errors++
              next
            }

            /^$/ {
              next
            }

            {
              print "ERRO: linha inesperada na linha " NR ":"
              print $0
              errors++
            }

            END {
              if (expecting_url == 1 ) {
                print "ERRO: o último #EXTINF não possui URL."
                errors++
              }

              if (errors > 0) {
                exit 1
              }
            }
          ' "${OUTPUT_FILE}"

          MARKDOWN="$(
            grep -E '^```|^\[[^]]+\]\(https?://' "${OUTPUT_FILE}" || true
           )"

          if [ -n "${MARKDOWN}" ]; then
            echo "ERRO: Markdown encontrado na playlist."
            exit 1
          fi

          ERRORS="$(
            grep -Ei 'erro|error|falha|failed|exception' "${OUTPUT_FILE}" || true
          )"

          if [ -n "${ERRORS}" ]; then
            echo "ERRO: mensagens de erro encontradas na playlist."
            echo "${ERRORS}"
            exit 1
          fi

          echo ""
          echo "Playlist validada com sucesso."
          echo "Entradas #EXTINF: ${EXTINF_COUNT}"
          echo "URLs: $(grep -cE '^https?://' "${OUTPUT_FILE}" || true )"

      # ========================================
      # CHECK UNEXPECTED CHANGES
      # ========================================
      - name: Check unexpected changes
        shell: bash
        run: |
          set -euo pipefail

          git status --short

          EXTRA_FILES="$(
            git status --porcelain=v1 |
            awk -v allowed="${OUTPUT_FILE}" '
              {
                path = substr($0, 4)

                if (path != allowed) {
                  print $0
                }
              }
            '
          )"

          if [ -n "${EXTRA_FILES}" ]; then
            echo ""
            echo "ERRO: arquivos adicionais foram criados ou alterados:"
            printf '%s\n' "${EXTRA_FILES}"
            exit 1
          fi

          echo "OK: somente ${OUTPUT_FILE} foi alterado."

      # ========================================
      # COMMIT AND PUSH
      # ========================================
      - name: Commit and push safely
        shell: bash
        run: |
          set -euo pipefail

          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          BRANCH="${GITHUB_REF_NAME}"

          git add -- "${OUTPUT_FILE}"

          if git diff --cached --quiet -- "${OUTPUT_FILE}"; then
            echo "Nenhuma alteração nova na playlist."
            exit 0
          fi

          git commit --only "${OUTPUT_FILE}" \
            -m "Atualiza playlist automaticamente"

          for i in 1 2 3 4 5; do
            echo ""
            echo "Tentativa ${i} de push."

            if git push origin "HEAD:${BRANCH}"; then
              echo "Push concluído com sucesso."
              exit 0
            fi

            echo "Push falhou. Atualizando a branch remota."

            git fetch origin "${BRANCH}"

            if ! git rebase "origin/${BRANCH}"; then
              echo "ERRO: conflito durante o rebase."
              git rebase --abort || true
              exit 1
            fi

            sleep 3
          done

          echo "ERRO: todas as tentativas de push falharam."
          exit 1
